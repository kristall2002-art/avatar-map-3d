<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #0d1518;
  --text: #ffffde;
  --acc:  #e8fe25;
  --mint: #25fea8;
  --fd: 'Clash Display', 'Arial Black', Impact, sans-serif;
  --fb: 'Satoshi', 'Inter', system-ui, sans-serif;
}

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  cursor: none;
}

/* ── CURSOR ── */
#cur-dot {
  position: fixed; top: 0; left: 0; z-index: 9999;
  width: 8px; height: 8px;
  background: var(--acc);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
#cur-ring {
  position: fixed; top: 0; left: 0; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,222,.5);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
@media (pointer: coarse) {
  #cur-dot, #cur-ring { display: none; }
  html, body { cursor: auto; }
}

/* ── LOADING SCREEN ── */
#loader {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  transform-origin: center center;
}
#loader-count {
  font-family: var(--fd);
  font-size: clamp(5rem, 18vw, 13rem);
  font-weight: 700;
  color: var(--bg);
  letter-spacing: -0.04em;
  line-height: 1;
  user-select: none;
}

/* ── CANVAS ── */
#gl {
  position: fixed; top: 0; left: 0;
  width: 100dvw; height: 100dvh;
  z-index: 1;
  display: block;
}

/* ── HERO ── */
#hero {
  position: relative; z-index: 10;
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: clamp(1.2rem, 2.5vw, 2rem);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
}

/* Узкий градиент снизу под текстом */
#hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 55%; height: 42%;
  background: radial-gradient(ellipse at bottom left, rgba(13,21,24,.95) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* тонкая сетка */
#hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,222,.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,222,.012) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none; z-index: 0;
}

.hi { position: relative; z-index: 1; display: block; }

.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.8rem;
  font-family: var(--fd);
  font-size: clamp(.55rem, 1.0vw, .80rem);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text);
  opacity: .65;
}

.hero-title {
  font-family: var(--fd);
  font-size: clamp(1.8rem, 5vw, 4.8rem);
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: .88;
  text-transform: uppercase;
  color: var(--text);
  transform: scaleY(2);
  transform-origin: bottom center;
  display: block;
  margin-bottom: 1.6rem;
  pointer-events: auto;
}

.hero-cta {
  pointer-events: auto;
  display: inline-block;
  font-family: var(--fd);
  font-size: clamp(.6rem, 1.0vw, .85rem);
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--acc);
  padding: .65em 1.3em;
  text-decoration: none;
  cursor: none;
  transition: background .2s;
  margin-bottom: 2rem;
}
.hero-cta:hover { background: var(--text); }

/* Атрибуция Wikimedia */
#attribution {
  position: fixed;
  bottom: 6px; left: clamp(1rem, 2.5vw, 2rem);
  z-index: 20;
  font-size: 9px;
  color: rgba(255,255,222,0.35);
  font-family: var(--fb);
  pointer-events: none;
  letter-spacing: .03em;
  white-space: nowrap;
}

/* ── MOBILE ── */
@media (max-width: 767px) {
  #hero {
    padding: 1rem 1rem;
    overflow: visible;
    justify-content: flex-end;
  }
  .hi {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .hero-title {
    font-size: clamp(1.6rem, 10vw, 3.2rem);
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
    transform-origin: bottom left;
    overflow: visible;
  }
  .hero-meta {
    font-size: clamp(.45rem, 2.8vw, .65rem);
    letter-spacing: .08em;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    margin-bottom: 0.6rem;
    opacity: .6;
    justify-content: flex-start;
  }
  .hero-meta span { display: block; }
  .hero-cta { margin-bottom: 1.2rem; }
  #hero::after {
    width: 90%; height: 40%;
  }
}

<!-- Three.js r128 UMD (global THREE) -->
<script src="./three.min.js"></script>
<!-- GSAP UMD -->
<script src="./gsap.min.js"></script>
<!-- Photo data — base64 inline, same-origin everywhere -->
<script src="./photos.js"></script>
<!-- Panorama & Pillar — base64 inline (same-origin, works in headless) -->
<script src="./panorama.js"></script>
<script src="./pillar.js"></script>

<!-- Postprocessing (Three.js r128 examples, локальные UMD-копии) -->
<script src="./CopyShader.js"></script>
<script src="./LuminosityHighPassShader.js"></script>
<script src="./EffectComposer.js"></script>
<script src="./RenderPass.js"></script>
<script src="./ShaderPass.js"></script>
<script src="./UnrealBloomPass.js"></script>

<script>
/* ═══════════════════════════════════════════════
   THREE.JS SCENE — Реальная панорама Чжанцзяцзе
   Путь A: billboard из реального фото скалы с прозрачным фоном (rembg PNG)
   Skybox: equirectangular сфера BackSide, offset 0.18 → красивый ракурс
   БЕЗ снежинок/белых частиц. Туман сизо-зелёный без точек.
═══════════════════════════════════════════════ */
(function() {
  var isMobile = window.innerWidth < 768;
  var dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 1.5);
  var canvas = document.getElementById('gl');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: !isMobile,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = false;
  } catch(e) {
    console.warn('WebGL failed:', e);
    canvas.style.display = 'none';
    renderer = null;
  }
  if (!renderer) return;

  var scene = new THREE.Scene();
  /* Атмосферный туман — сизо-серо-зелёный, дымка ущелья */
  scene.fog = new THREE.FogExp2(0x3a4a3c, 0.022);

  /* ── CAMERA ── */
  var fov = isMobile ? 70 : 58;
  var camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 600);

  var orbitRadius = isMobile ? 6.0 : 9.0;
  var orbitHeight = isMobile ? 0.0 : -0.5;
  camera.position.set(orbitRadius, orbitHeight, 0);
  camera.lookAt(0, 2.0, 0);

  /* ── POSTPROCESSING ── */
  var composer = null;
  var useBloom = false;
  try {
    if (typeof THREE.EffectComposer !== 'undefined' &&
        typeof THREE.RenderPass !== 'undefined' &&
        typeof THREE.UnrealBloomPass !== 'undefined') {

      var renderTarget = new THREE.WebGLRenderTarget(
        window.innerWidth * dpr,
        window.innerHeight * dpr,
        {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
          encoding: THREE.sRGBEncoding
        }
      );

      composer = new THREE.EffectComposer(renderer, renderTarget);
      var renderPass = new THREE.RenderPass(scene, camera);
      composer.addPass(renderPass);

      var bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.35,  /* strength — мягкий bloom */
        0.50,
        0.88
      );
      composer.addPass(bloomPass);
      useBloom = true;
    }
  } catch(bloomErr) {
    composer = null; useBloom = false;
  }

  /* ── TEXTURE LOADER ── */
  var txLoader = new THREE.TextureLoader();

  /* ══════════════════════════════════════════════════
     SKYBOX — 360° панорама Чжанцзяцзе (equirectangular)
     SphereGeometry BackSide. Шов устранён блендингом краёв в Python.
     wrapS=RepeatWrapping + offset правильно оборачивает без шва.
  ════════════════════════════════════════════════ */
  var skyMesh = null;

  var panoSrc = (typeof PANORAMA_B64 !== 'undefined' && PANORAMA_B64)
    ? PANORAMA_B64
    : 'img/panorama_zhangjiajie.jpg';

  txLoader.load(
    panoSrc,
    function(tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      /* Смещение — красивый ракурс, столбы впереди.
         offset=0.18 → панорама сдвинута на 18%. Шов (u=0/1) виден примерно при
         орбитальном повороте 180+65=245° — это «за спиной» в нижней части облёта */
      tex.offset.set(0.18, 0.0);

      var skyGeo = new THREE.SphereGeometry(380, 72, 36);
      var skyMat = new THREE.MeshBasicMaterial({
        map: tex,
        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
        fog: false,
      });
      skyMesh = new THREE.Mesh(skyGeo, skyMat);
      skyMesh.renderOrder = -1;
      scene.add(skyMesh);
      console.log('[avatar3d] Panorama OK');
    },
    undefined,
    function(err) {
      console.warn('[avatar3d] Panorama fail:', err);
      scene.background = new THREE.Color(0x060e10);
    }
  );

  /* ══════════════════════════════════════════════════
     ЦЕНТРАЛЬНЫЙ СТОЛБ — Путь A: BILLBOARD из реального фото скалы
     PNG с прозрачным фоном (rembg). Две скрещённые плоскости (crossed-billboard)
     + доворот к камере по Y → при облёте не схлопывается.
     Геометрическая опора-цилиндр уходит в туман снизу.
  ════════════════════════════════════════════════ */

  /* ── Геометрическая опора (нижняя часть, уходит в туман) ── */
  function fbmNoise(angle, y) {
    var n1 = Math.sin(angle * 3.5 + y * 1.4) * Math.cos(y * 0.8) * 0.14;
    var n2 = Math.sin(angle * 7.1 + y * 3.1) * 0.06;
    var n3 = Math.sin(angle * 15.3 + y * 7.2) * 0.028;
    var groove = Math.sin(angle * 7.0) * 0.055 + Math.sin(angle * 13.5) * 0.028;
    return n1 + n2 + n3 + groove;
  }

  function makeRockyGeo(topR, botR, height, radSeg, hSeg) {
    var geo = new THREE.CylinderGeometry(topR, botR, height, radSeg, hSeg, false);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
      var r = Math.sqrt(px*px + pz*pz);
      if (r < 0.001) continue;
      var angle = Math.atan2(pz, px);
      var jitter = fbmNoise(angle, py);
      var newR = r + jitter;
      pos.setX(i, Math.cos(angle) * newR);
      pos.setZ(i, Math.sin(angle) * newR);
    }
    geo.computeVertexNormals();
    return geo;
  }

  /* Материал опоры — серый камень Чжанцзяцзе */
  var matBase = new THREE.MeshStandardMaterial({
    color: 0x7a7a6a,
    roughness: 0.96,
    metalness: 0.0,
  });

  var radSeg = isMobile ? 40 : 64;

  /* Опора — уходит вниз в туман */
  var pillarGroup = new THREE.Group();
  scene.add(pillarGroup);

  var geoBase = makeRockyGeo(0.30, 0.42, 8.0, radSeg, 12);
  var meshBase = new THREE.Mesh(geoBase, matBase);
  meshBase.position.y = -7.0;
  pillarGroup.add(meshBase);

  /* PBR-текстуры для опоры */
  function setupTex(tex, srgb, repX, repY) {
    if (srgb) tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.MirroredRepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repX, repY);
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
    return tex;
  }

  txLoader.load('img/rock/rock_diff.jpg', function(t) {
    setupTex(t, true, 1, 2.5); matBase.map = t; matBase.color.set(0x7a8070); matBase.needsUpdate = true;
  }, undefined, function() {
    txLoader.load('img/rock/cliff_diff.jpg', function(t) {
      setupTex(t, true, 1, 2.5); matBase.map = t; matBase.needsUpdate = true;
    });
  });
  txLoader.load('img/rock/rock_nor.jpg', function(t) {
    setupTex(t, false, 1, 2.5); matBase.normalMap = t; matBase.normalScale.set(1.8, 1.8); matBase.needsUpdate = true;
  }, undefined, function() {
    txLoader.load('img/rock/cliff_nor.jpg', function(t) {
      setupTex(t, false, 1, 2.5); matBase.normalMap = t; matBase.normalScale.set(1.6, 1.6); matBase.needsUpdate = true;
    });
  });

  /* ── BILLBOARD-СТОЛБ из реального фото (Путь A) ── */
  /* Две скрещённые плоскости → не «схлопывается» при облёте */
  var billboardGroup = new THREE.Group();
  billboardGroup.position.y = 6.5; /* центр по высоте сцены */
  scene.add(billboardGroup);

  /* Высота и ширина billboard-плоскости */
  var bbH = isMobile ? 18 : 22;
  var bbW = bbH * (800 / 1200); /* соотношение исходного фото */

  var matBillboard = new THREE.MeshBasicMaterial({
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    alphaTest: 0.05,
    fog: false,
  });

  /* Загружаем PNG с прозрачным фоном (rembg) */
  var pillarSrc = (typeof PILLAR_B64 !== 'undefined' && PILLAR_B64)
    ? PILLAR_B64
    : 'img/pillar_cutout.png';

  txLoader.load(
    pillarSrc,
    function(tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      matBillboard.map = tex;
      matBillboard.needsUpdate = true;
      console.log('[avatar3d] Billboard pillar photo OK');
    },
    undefined,
    function() { console.warn('[avatar3d] Billboard photo fail'); }
  );

  var bbGeo = new THREE.PlaneGeometry(bbW, bbH);

  /* Одна плоскость — true billboard (доворот к камере в animate()).
     Чтобы не «схлопывалась» — billboardGroup всегда lookAt camera. */
  var bb1 = new THREE.Mesh(bbGeo, matBillboard);
  billboardGroup.add(bb1);

  /* Emissive-кольцо у основания билборда */
  var geoRing = new THREE.TorusGeometry(0.55, 0.013, 8, 80);
  var matRing = new THREE.MeshBasicMaterial({ color: 0xaaff44, transparent: true, opacity: 0.55 });
  var ringGlow = new THREE.Mesh(geoRing, matRing);
  ringGlow.position.y = -bbH / 2 - 0.3;
  ringGlow.rotation.x = Math.PI / 2;
  billboardGroup.add(ringGlow);

  /* ── LIGHTS — под зелёно-туманный парк ── */
  var hemiLight = new THREE.HemisphereLight(0x9aaa9a, 0x1a2a12, 0.60);
  scene.add(hemiLight);

  var ambLight = new THREE.AmbientLight(0x6a8070, 0.55);
  scene.add(ambLight);

  var dirLight = new THREE.DirectionalLight(0xd8dcb8, 1.0);
  dirLight.position.set(8, 18, 6);
  scene.add(dirLight);

  var rimLight = new THREE.DirectionalLight(0x7aaabb, 0.40);
  rimLight.position.set(-6, 10, -10);
  scene.add(rimLight);

  var pointBottom = new THREE.PointLight(0x55991a, 3.0, 14, 2);
  pointBottom.position.set(0, -3.0, 0);
  scene.add(pointBottom);

  var pointFog = new THREE.PointLight(0x2a5535, 1.6, 20, 2);
  pointFog.position.set(-3, -1.5, -4);
  scene.add(pointFog);

  var pillarSpot = new THREE.PointLight(0xc0d8a0, 2.0, 28, 2);
  pillarSpot.position.set(5, 8, 5);
  scene.add(pillarSpot);

  /* ── ТУМАН (объёмный) — плоские слои у основания, НЕТ белых точек ── */
  function makeMistTexture(r, g, b, innerAlpha) {
    var sz = 512;
    var c = document.createElement('canvas');
    c.width = c.height = sz;
    var ctx = c.getContext('2d');
    var grad = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
    grad.addColorStop(0,   'rgba(' + r + ',' + g + ',' + b + ',' + innerAlpha.toFixed(2) + ')');
    grad.addColorStop(0.40,'rgba(' + r + ',' + g + ',' + b + ',' + (innerAlpha * 0.45).toFixed(2) + ')');
    grad.addColorStop(0.75,'rgba(' + r + ',' + g + ',' + b + ',' + (innerAlpha * 0.12).toFixed(2) + ')');
    grad.addColorStop(1,   'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, sz, sz);
    var tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  /* Сизо-зелёная дымка — тон панорамы */
  var mistTexDense = makeMistTexture(35, 58, 42, 0.60);
  var mistTexLight = makeMistTexture(26, 48, 36, 0.38);
  var mistTexBlue  = makeMistTexture(24, 40, 52, 0.45);

  var mistLayers = [];
  var mistParams = [
    { y: -5.5, sx: 20, sz: 16, op: 0.58, spd:  0.008, tex: 'dense' },
    { y: -4.0, sx: 15, sz: 11, op: 0.44, spd: -0.006, tex: 'light' },
    { y: -2.5, sx: 11, sz:  9, op: 0.32, spd:  0.010, tex: 'blue'  },
    { y: -1.0, sx: 16, sz: 12, op: 0.22, spd: -0.007, tex: 'dense' },
    { y:  0.8, sx: 12, sz: 10, op: 0.14, spd:  0.009, tex: 'light' },
    { y: -7.0, sx: 24, sz: 20, op: 0.72, spd:  0.005, tex: 'dense' },
    { y: -3.5, sx: 18, sz: 13, op: 0.28, spd: -0.011, tex: 'blue'  },
  ];

  mistParams.forEach(function(p, i) {
    var texMap = p.tex === 'dense' ? mistTexDense : p.tex === 'blue' ? mistTexBlue : mistTexLight;
    var geo = new THREE.PlaneGeometry(p.sx, p.sz);
    var mat = new THREE.MeshBasicMaterial({
      map: texMap, transparent: true, opacity: p.op,
      depthWrite: false, blending: THREE.NormalBlending, side: THREE.DoubleSide,
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.rotation.z = (i / mistParams.length) * Math.PI * 2;
    mesh.position.y = p.y;
    mesh.position.x = (i % 2 === 0 ? 0.6 : -0.6);
    mesh.position.z = (i % 3 === 0 ? 0.5 : -0.4);
    mesh.userData.speed = p.spd;
    mesh.userData.baseY = p.y;
    mesh.userData.phase = i * 1.3;
    scene.add(mesh);
    mistLayers.push(mesh);
  });

  /* ── КОЛЬЦО ФОТОГРАФИЙ — аккуратное, фиксированный радиус, одна высота ── */
  var photoFiles = (typeof PHOTO_DATA !== 'undefined' && PHOTO_DATA.length > 0)
    ? PHOTO_DATA
    : [
        'img/034.jpg', 'img/035.jpg', 'img/039.jpg', 'img/040.jpg',
        'img/042.jpg', 'img/048.jpg', 'img/053.jpg', 'img/054.jpg',
        'img/055.jpg', 'img/073.jpg', 'img/082.jpg', 'img/089.jpg',
        'img/090.jpg'
      ];

  var photoGroup = new THREE.Group();
  scene.add(photoGroup);

  var loader = new THREE.TextureLoader();

  var N = photoFiles.length;
  /* Фиксированный радиус — аккуратное замкнутое кольцо */
  var ringRadius = isMobile ? 3.4 : 5.8;
  var photoW = isMobile ? 0.92 : 1.42;
  var photoH = photoW * 1.33;
  /* Небольшое чередование высоты: +0 и -0.25 — еле заметно, кольцо ровное */
  var yBase = isMobile ? 2.0 : 1.2;
  var yAlt  = 0.22; /* небольшое чередование */

  photoFiles.forEach(function(file, idx) {
    var angle = (idx / N) * Math.PI * 2;
    var yOffset = yBase + (idx % 2 === 0 ? yAlt : -yAlt);

    var group = new THREE.Group();
    group.position.set(
      Math.sin(angle) * ringRadius,
      yOffset,
      Math.cos(angle) * ringRadius
    );
    /* Поворот строго к центру — НЕТ хаотичных углов */
    group.rotation.y = angle + Math.PI;

    /* Тонкая тёмная рамка */
    var frameMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW + 0.055, photoH + 0.055),
      new THREE.MeshBasicMaterial({ color: 0x0e1a10, side: THREE.FrontSide })
    );
    group.add(frameMesh);

    /* Лёгкий зелёный glow */
    var glowMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW + 0.18, photoH + 0.18),
      new THREE.MeshBasicMaterial({
        color: 0x44cc88, transparent: true, opacity: 0.10,
        side: THREE.FrontSide, depthWrite: false,
      })
    );
    glowMesh.position.z = -0.01;
    group.add(glowMesh);

    var photoMat = new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.0, color: 0xffffff });
    var photoMesh = new THREE.Mesh(new THREE.PlaneGeometry(photoW, photoH), photoMat);
    photoMesh.position.z = 0.002;
    group.add(photoMesh);

    loader.load(
      file,
      (function(mat) {
        return function(texture) {
          texture.encoding = THREE.sRGBEncoding;
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          mat.map = texture;
          mat.needsUpdate = true;
        };
      })(photoMat),
      undefined,
      function() {}
    );

    photoGroup.add(group);
  });

  /* ── БЕЗ БЕЛЫХ ЧАСТИЦ (снег/пыль удалены) ── */
  /* Атмосфера создаётся только туманом FogExp2 + мист-плоскостями */

  /* ── ОРБИТАЛЬНЫЙ ОБЛЁТ ── */
  var orbitPeriod   = 38.0;
  var orbitBobAmp   = 0.9;
  var orbitBobPeriod = 13.0;

  var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', function(e) {
    mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── CURSOR ── */
  var dot  = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  var cx = 0, cy = 0, rx = 0, ry = 0;
  window.addEventListener('mousemove', function(e) { cx = e.clientX; cy = e.clientY; });

  var clock = new THREE.Clock();

  /* Скорость вращения панорамы */
  var panoRotSpeed = 0.0006;

  /* ── ANIMATE ── */
  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    /* Скайбокс медленно вращается */
    if (skyMesh) skyMesh.rotation.y = t * panoRotSpeed;

    /* True billboard: плоскость всегда смотрит на камеру по Y-оси */
    billboardGroup.lookAt(camera.position.x, billboardGroup.position.y, camera.position.z);
    /* Лёгкое покачивание — добавляем после lookAt */
    billboardGroup.rotation.z += Math.sin(t * 0.18) * 0.001;

    /* Опора */
    pillarGroup.rotation.y = t * 0.008;

    /* Кольцо фото — только вращение по Y, наклона нет */
    photoGroup.rotation.y = -t * 0.016;
    photoGroup.rotation.x = 0;

    /* Пульсация */
    matRing.opacity = 0.35 + Math.sin(t * 1.7) * 0.18;
    pointBottom.intensity = 2.6 + Math.sin(t * 1.1) * 0.6;
    pointFog.intensity    = 1.4 + Math.sin(t * 0.7 + 1.0) * 0.35;

    /* Туман — плавный дрейф */
    mistLayers.forEach(function(m) {
      m.rotation.z += m.userData.speed * 0.008;
      m.position.y = m.userData.baseY + Math.sin(t * 0.20 + m.userData.phase) * 0.28;
      m.position.x = Math.sin(t * 0.07 + m.userData.phase) * 0.6;
    });

    /* ── КАМЕРА — орбитальный облёт ── */
    var orbitAngle = (t / orbitPeriod) * Math.PI * 2;
    var bobY = orbitHeight + Math.sin(t / orbitBobPeriod * Math.PI * 2) * orbitBobAmp;
    var currentRadius = orbitRadius + Math.sin(t * 0.17) * 1.5;

    var camX = Math.cos(orbitAngle) * currentRadius;
    var camZ = Math.sin(orbitAngle) * currentRadius;

    mouse.x += (mouse.tx - mouse.x) * 0.035;
    mouse.y += (mouse.ty - mouse.y) * 0.035;
    if (!isMobile) {
      camX += mouse.x * 0.8;
      camZ += mouse.y * 0.4;
    }

    camera.position.set(camX, bobY, camZ);
    camera.lookAt(0, 4.0, 0);

    pillarSpot.position.set(camX * 0.7, bobY + 4.0, camZ * 0.7);

    /* Рендер */
    if (composer && useBloom) {
      try { composer.render(); } catch(e) {
        useBloom = false; composer = null;
        renderer.render(scene, camera);
      }
    } else {
      renderer.render(scene, camera);
    }

    /* Cursor */
    if (dot)  { dot.style.left = cx + 'px'; dot.style.top = cy + 'px'; }
    if (ring) {
      rx += (cx - rx) * 0.11;
      ry += (cy - ry) * 0.11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
    }
  }
  animate();

})();
</script>

<!-- ═══════════════════════════════════════════════
   LOADER
══════════════════════════════════════════════ -->
<script>
(function() {
  if (document.documentElement.getAttribute('data-sl') === '1') return;

  var loaderEl  = document.getElementById('loader');
  var counterEl = document.getElementById('loader-count');
  var heroEl    = document.getElementById('hero');

  var T = 2400;
  var t0 = performance.now();
  (function tick(now) {
    var p = Math.min((now - t0) / T, 1);
    var e = p < .5 ? 2*p*p : -1 + (4 - 2*p)*p;
    counterEl.textContent = String(Math.floor(e * 100)).padStart(3, '0') + '%';
    if (p < 1) requestAnimationFrame(tick);
    else counterEl.textContent = '100%';
  })(performance.now());

  setTimeout(function() {
    if (typeof gsap !== 'undefined') {
      var W = window.innerWidth, H = window.innerHeight;
      var sv = (Math.max(W, H, 1920) / Math.min(W, H)) * 22;
      gsap.timeline()
        .to(loaderEl, { rotate: 180, scale: sv, duration: 0.85, ease: 'power3.in' })
        .to(loaderEl, { opacity: 0, duration: 0.3, ease: 'power2.out',
            onComplete: function() { loaderEl.style.display = 'none'; } }, '-=0.15')
        .to(heroEl,   { opacity: 1, duration: 0.7, ease: 'power2.out' }, '-=0.3');
    } else {
      loaderEl.style.display = 'none';
      heroEl.style.opacity = '1';
    }
  }, 2600);
})();
</script>
