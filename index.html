<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #0d1518;
  --text: #ffffde;
  --acc:  #e8fe25;
  --mint: #25fea8;
  --fd: 'Clash Display', 'Arial Black', Impact, sans-serif;
  --fb: 'Satoshi', 'Inter', system-ui, sans-serif;
}

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  cursor: none;
}

/* ── CURSOR ── */
#cur-dot {
  position: fixed; top: 0; left: 0; z-index: 9999;
  width: 8px; height: 8px;
  background: var(--acc);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
#cur-ring {
  position: fixed; top: 0; left: 0; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,222,.5);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
@media (pointer: coarse) {
  #cur-dot, #cur-ring { display: none; }
  html, body { cursor: auto; }
}

/* ── LOADING SCREEN ── */
#loader {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  transform-origin: center center;
}
#loader-count {
  font-family: var(--fd);
  font-size: clamp(5rem, 18vw, 13rem);
  font-weight: 700;
  color: var(--bg);
  letter-spacing: -0.04em;
  line-height: 1;
  user-select: none;
}

/* ── SKY GRADIENT (за canvas, просвечивает через туман) ── */
#sky-bg {
  position: fixed; inset: 0;
  z-index: 0;
  background: linear-gradient(
    to bottom,
    #040c10 0%,
    #081420 25%,
    #0d1d14 60%,
    #111f10 100%
  );
  pointer-events: none;
}

/* ── CANVAS ── */
#gl {
  position: fixed; top: 0; left: 0;
  width: 100dvw; height: 100dvh;
  z-index: 1;
  display: block;
}

/* ── HERO ── */
#hero {
  position: relative; z-index: 10;
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: clamp(1.2rem, 2.5vw, 2rem);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
}

/* Узкий градиент снизу под текстом — для читаемости, не перекрывает сцену */
#hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 45%; height: 38%;
  background: radial-gradient(ellipse at bottom left, rgba(13,21,24,.90) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* тонкая сетка */
#hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,222,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,222,.018) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none; z-index: 0;
}

.hi { position: relative; z-index: 1; display: block; }

.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.8rem;
  font-family: var(--fd);
  font-size: clamp(.5rem, 0.9vw, .72rem);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text);
  opacity: .55;
}

/* Уменьшенный заголовок — ~45% от предыдущего */
.hero-title {
  font-family: var(--fd);
  font-size: clamp(1.8rem, 5vw, 4.8rem);
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: .88;
  text-transform: uppercase;
  color: var(--text);
  transform: scaleY(2);
  transform-origin: bottom center;
  display: block;
  margin-bottom: 1.6rem;
  pointer-events: auto;
}

.hero-cta {
  pointer-events: auto;
  display: inline-block;
  font-family: var(--fd);
  font-size: clamp(.55rem, 0.9vw, .78rem);
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--acc);
  padding: .6em 1.2em;
  text-decoration: none;
  cursor: none;
  transition: background .2s;
  margin-bottom: 2rem;
}
.hero-cta:hover { background: var(--text); }

/* ── MOBILE ── */
@media (max-width: 767px) {
  #hero {
    padding: 1rem 1rem;
    overflow: visible;
    justify-content: flex-end;
  }
  .hi {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .hero-title {
    font-size: clamp(1.6rem, 10vw, 3.2rem);
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
    transform-origin: bottom left;
    overflow: visible;

  .hero-meta {
    font-size: clamp(.4rem, 2.5vw, .6rem);
    letter-spacing: .08em;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    margin-bottom: 0.6rem;
    opacity: .5;
    justify-content: flex-start;
  }
  .hero-meta span { display: block; }
  .hero-cta { margin-bottom: 1.2rem; }
  #hero::after {
    width: 80%; height: 35%;
  }
}

<script>
/* ═══════════════════════════════════════════════
   ROCK PILLAR SHADERS — фото-текстура + каменный шум
═══════════════════════════════════════════════ */
var PILLAR_VS = [
'precision highp float;',
'uniform float uTime;',
'varying vec3 vNormal;',
'varying vec3 vPos;',
'varying float vY;',
'varying vec2 vUv;',

/* Simplex noise для органической деформации */
'vec3 m3(vec3 x){return x-floor(x*(1./289.))*289.;}',
'vec4 m4(vec4 x){return x-floor(x*(1./289.))*289.;}',
'vec4 pm(vec4 x){return m4(((x*34.)+1.)*x);}',
'vec4 ts(vec4 r){return 1.79284291400159-0.85373472095314*r;}',
'float sn3(vec3 v){',
'  const vec2 C=vec2(1./6.,1./3.);',
'  const vec4 D=vec4(0.,.5,1.,2.);',
'  vec3 i=floor(v+dot(v,C.yyy));',
'  vec3 x0=v-i+dot(i,C.xxx);',
'  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;',
'  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);',
'  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;',
'  i=m3(i);',
'  vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));',
'  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;',
'  vec4 j=p-49.*floor(p*ns.z*ns.z);',
'  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);',
'  vec4 xs=x_*ns.x+ns.yyyy;vec4 ys=y_*ns.x+ns.yyyy;',
'  vec4 h=1.-abs(xs)-abs(ys);',
'  vec4 b0=vec4(xs.xy,ys.xy);vec4 b1=vec4(xs.zw,ys.zw);',
'  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;',
'  vec4 sh=-step(h,vec4(0.));',
'  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
'  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);',
'  vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);',
'  vec4 nm=ts(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
'  p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;',
'  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);',
'  m=m*m;',
'  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
'}',

'void main(){',
'  vNormal = normalMatrix * normal;',
'  vUv = uv;',
'  vY = position.y;',
/* Многослойный шум для каменной неровности */
'  float n1 = sn3(position * 1.8 + vec3(0.0, uTime * 0.0, 0.0));',
'  float n2 = sn3(position * 4.2) * 0.5;',
'  float n3 = sn3(position * 9.5) * 0.25;',
'  float n = n1 + n2 + n3;',
/* Смещение вершин вдоль нормали — сильнее, чем раньше */
'  vec3 pos = position + normal * n * 0.12;',
/* Вертикальные борозды — как у настоящей скалы */
'  float groove = sin(atan(position.z, position.x) * 8.0) * 0.04;',
'  pos.x += groove * normalize(position).x;',
'  pos.z += groove * normalize(position).z;',
'  vPos = (modelMatrix * vec4(pos, 1.0)).xyz;',
'  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
'}'
].join('\n');

var PILLAR_FS = [
'precision highp float;',
'uniform float uTime;',
'uniform sampler2D uTexture;',
'uniform float uHasTexture;',
'varying vec3 vNormal;',
'varying vec3 vPos;',
'varying float vY;',
'varying vec2 vUv;',

/* Simplex noise для фрагментного шейдера */
'vec3 m3f(vec3 x){return x-floor(x*(1./289.))*289.;}',
'vec4 pm4(vec4 x){return x-floor(x*(1./289.))*289.;}',
'vec4 pm2(vec4 x){return pm4(((x*34.)+1.)*x);}',
'vec4 ts2(vec4 r){return 1.79284291400159-0.85373472095314*r;}',
'float sn3f(vec3 v){',
'  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);',
'  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);',
'  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;',
'  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);',
'  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;',
'  i=m3f(i);',
'  vec4 p=pm2(pm2(pm2(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));',
'  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;',
'  vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);',
'  vec4 xs=x_*ns.x+ns.yyyy;vec4 ys=y_*ns.x+ns.yyyy;vec4 h=1.-abs(xs)-abs(ys);',
'  vec4 b0=vec4(xs.xy,ys.xy);vec4 b1=vec4(xs.zw,ys.zw);',
'  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));',
'  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
'  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);',
'  vec4 nm=ts2(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
'  p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;',
'  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;',
'  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
'}',

'void main(){',
'  vec3 n = normalize(vNormal);',
'  vec3 viewDir = normalize(cameraPosition - vPos);',

/* Фото-текстура скалы — цилиндрические UV */
'  vec3 col;',
'  if(uHasTexture > 0.5) {',
'    vec4 texCol = texture2D(uTexture, vUv);',
    /* Хорошо видимая текстура скалы — не слишком тёмная */
'    col = texCol.rgb * 0.75;',
    /* Добавляем каменный шум поверх для фактуры */
'    float rockNoise = sn3f(vPos * 3.0) * 0.08 + sn3f(vPos * 7.0) * 0.04;',
'    col = mix(col, col * (1.0 + rockNoise), 0.5);',
'  } else {',
    /* Процедурный каменный цвет если текстура не загрузилась */
'    float t = clamp((vY + 8.0) / 18.0, 0.0, 1.0);',
'    vec3 darkStone = vec3(0.04, 0.05, 0.04);',
'    vec3 lightStone = vec3(0.16, 0.18, 0.14);',
'    float rockN = sn3f(vPos * 2.5) * 0.5 + 0.5;',
'    float rockN2 = sn3f(vPos * 6.0) * 0.5 + 0.5;',
'    col = mix(darkStone, lightStone, t * 0.7 + rockN * 0.2 + rockN2 * 0.1);',
'  }',

/* Матовое освещение — без пластикового блеска */
'  vec3 light1 = normalize(vec3(1.5, 2.5, 4.0));',
'  vec3 light2 = normalize(vec3(-1.0, 0.8, 1.5));',
'  float diff1 = max(dot(n, light1), 0.0) * 0.80;',
'  float diff2 = max(dot(n, light2), 0.0) * 0.30;',
'  col = col * (0.65 + diff1 + diff2);',

/* Ambient fog подсветка — атмосферный зеленоватый */
'  float fogGlow = clamp(1.0 - (vY + 8.0) / 14.0, 0.0, 1.0);',
'  col += fogGlow * vec3(0.03, 0.10, 0.05) * 0.6;',

/* Подсветка снизу — тёплый акцентный свет снизу */
'  float bottomLight = clamp(1.0 - (vY + 4.0) / 7.0, 0.0, 1.0);',
'  col += bottomLight * vec3(0.18, 0.22, 0.06) * 0.45;',

/* Rim-свечение — тонкий контур */
'  float fr = pow(1.0 - max(dot(viewDir, n), 0.0), 5.0);',
'  col += fr * vec3(0.20, 0.35, 0.15) * 0.45;',

/* Мягкий specular — матовая скала, не блестит */
'  vec3 hv = normalize(light1 + viewDir);',
'  float sp = pow(max(dot(n, hv), 0.0), 8.0);',
'  col += sp * vec3(0.08, 0.10, 0.06) * 0.25;',

'  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
'}'
].join('\n');

/* ═══════════════════════════════════════════════
   THREE.JS SCENE
═══════════════════════════════════════════════ */
(function() {
  var isMobile = window.innerWidth < 768;
  var dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 1.5);
  var canvas = document.getElementById('gl');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !isMobile, alpha: true });
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = false;
  } catch(e) {
    console.warn('WebGL failed:', e);
    canvas.style.display = 'none';
    renderer = null;
  }
  if (!renderer) return;

  var scene = new THREE.Scene();
  /* Фон прозрачный — CSS-градиент неба просвечивает */
  /* Туман — глубина и дымка Чжанцзяцзе, но не слишком плотный */
  scene.fog = new THREE.FogExp2(0x0d1a14, 0.026);

  /* ── CAMERA ── */
  var fov = isMobile ? 55 : 42;
  var camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 300);

  /* Начальная позиция — будет управляться орбитальным облётом */
  var orbitRadius = isMobile ? 7.5 : 12.0;
  var orbitHeight = isMobile ? 0.5 : -1.0;
  camera.position.set(orbitRadius, orbitHeight, 0);
  camera.lookAt(0, 1.5, 0);

  /* ── LIGHTS ── */
  /* Ambient низкий — тёмная кинематографичная сцена */
  var ambient = new THREE.AmbientLight(0x1a2520, 0.7);
  scene.add(ambient);

  /* Основной направленный свет — сбоку и сверху */
  var dirLight = new THREE.DirectionalLight(0xc8d8c0, 1.2);
  dirLight.position.set(4, 10, 6);
  scene.add(dirLight);

  /* Подсветка столба снизу — тёплый туманный свет */
  var pointBottom = new THREE.PointLight(0x88cc44, 2.0, 12, 2);
  pointBottom.position.set(0, -4, 0);
  scene.add(pointBottom);

  /* Подсветка снизу сзади — атмосферный зелёный */
  var pointFog = new THREE.PointLight(0x44aa66, 1.5, 20, 2);
  pointFog.position.set(-3, -2, -5);
  scene.add(pointFog);

  /* Rim-свет сзади столба */
  var rimLight = new THREE.DirectionalLight(0x88ffaa, 0.5);
  rimLight.position.set(-2, 3, -6);
  scene.add(rimLight);

  /* Прямая подсветка столба спереди — чтобы текстура читалась */
  var pillarSpot = new THREE.PointLight(0xb8cca8, 1.8, 16, 2);
  pillarSpot.position.set(4, 3, 4);
  scene.add(pillarSpot);

  /* Небо — тёплый акцент сверху */
  var skyLight = new THREE.DirectionalLight(0xd0e8ff, 0.4);
  skyLight.position.set(0, 15, 0);
  scene.add(skyLight);

  /* ── ЗАГРУЖАЕМ ТЕКСТУРУ СКАЛЫ ── */
  /* img/082.jpg — высокая вертикальная скала 1280x1893 */
  var pillarTexture = null;
  var pillarTextureLoaded = false;
  var txLoader = new THREE.TextureLoader();
  txLoader.load(
    'img/082.jpg',
    function(texture) {
      texture.encoding = THREE.sRGBEncoding;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 2.0); /* повторить вертикально */
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      pillarTexture = texture;
      pillarTextureLoaded = true;
      /* Обновляем материал */
      pillarUniforms.uTexture.value = texture;
      pillarUniforms.uHasTexture.value = 1.0;
    },
    undefined,
    function() {
      /* Fallback — попробуем 055.jpg */
      txLoader.load('img/055.jpg', function(texture) {
        texture.encoding = THREE.sRGBEncoding;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 2.0);
        pillarTexture = texture;
        pillarTextureLoaded = true;
        pillarUniforms.uTexture.value = texture;
        pillarUniforms.uHasTexture.value = 1.0;
      });
    }
  );

  /* Материал столба — MeshStandardMaterial с фото-текстурой */
  /* Получает все lights сцены, roughness матовый = нет пластика */
  var matPillar = new THREE.MeshStandardMaterial({
    color: 0x4a5545,    /* базовый цвет — тёмный каменный, пока текстура не загружена */
    roughness: 0.95,    /* очень матовый — настоящая скала, без блеска */
    metalness: 0.02,    /* почти нет металла */
    envMapIntensity: 0.1,
  });

  /* Загружаем текстуру фото-скалы */
  txLoader.load(
    'img/082.jpg',
    function(texture) {
      texture.encoding = THREE.sRGBEncoding;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 2.5);
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      matPillar.map = texture;
      matPillar.color = new THREE.Color(0xffffff);
      matPillar.needsUpdate = true;
    },
    undefined,
    function() {
      txLoader.load('img/055.jpg', function(texture) {
        texture.encoding = THREE.sRGBEncoding;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 2.0);
        matPillar.map = texture;
        matPillar.color = new THREE.Color(0xffffff);
        matPillar.needsUpdate = true;
      });
    }
  );

  /* Placeholder uniforms для совместимости (шейдер убрали, но переменная нужна для часов) */
  var pillarUniforms = { uTime: { value: 0 } };

  /* ── ЦЕНТРАЛЬНЫЙ СТОЛБ — КАМЕННАЯ СКАЛА ── */
  var pillarGroup = new THREE.Group();
  scene.add(pillarGroup);

  var seg = isMobile ? 10 : 16;

  /* Создаём неровную геометрию скалы — несколько секций */
  function makeRockySection(topR, botR, height, segsY) {
    var geo = new THREE.CylinderGeometry(topR, botR, height, seg, segsY, false);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
      var r = Math.sqrt(px*px + pz*pz);
      if (r < 0.001) continue;
      /* Многоуровневый шум */
      var angle = Math.atan2(pz, px);
      var seed1 = angle * 3.7 + py * 1.8;
      var seed2 = angle * 7.3 + py * 3.4;
      var seed3 = angle * 13.1 + py * 6.7;
      var jitter = Math.sin(seed1) * 0.10
                 + Math.sin(seed2) * 0.05
                 + Math.sin(seed3) * 0.025;
      /* Вертикальные борозды скалы */
      var groove = Math.sin(angle * 9.0) * 0.05 + Math.sin(angle * 17.0) * 0.025;
      var newR = r + jitter + groove;
      pos.setX(i, Math.cos(angle) * newR);
      pos.setZ(i, Math.sin(angle) * newR);
    }
    geo.computeVertexNormals();
    return geo;
  }

  /* Основной монолит — высокий и уходит за кадр */
  var geoMain = makeRockySection(0.20, 0.35, 14.0, 10);
  var meshMain = new THREE.Mesh(geoMain, matPillar);
  meshMain.position.y = 2.0;
  pillarGroup.add(meshMain);

  /* Верхний пик — острый, за кадром */
  var geoCap = makeRockySection(0.04, 0.20, 5.0, 5);
  var meshCap = new THREE.Mesh(geoCap, matPillar);
  meshCap.position.y = 11.5;
  pillarGroup.add(meshCap);

  /* Средняя секция с выступом — придаёт объём скале */
  var geoMid = makeRockySection(0.30, 0.24, 4.0, 4);
  var meshMid = new THREE.Mesh(geoMid, matPillar);
  meshMid.position.y = -3.0;
  pillarGroup.add(meshMid);

  /* Основание уходит в туман */
  var geoBase = makeRockySection(0.40, 0.50, 4.0, 3);
  var meshBase = new THREE.Mesh(geoBase, matPillar);
  meshBase.position.y = -7.0;
  pillarGroup.add(meshBase);

  /* Светящееся кольцо вокруг основания */
  var geoRing = new THREE.TorusGeometry(0.55, 0.014, 8, 64);
  var matRing = new THREE.MeshBasicMaterial({ color: 0x88ff44, transparent: true, opacity: 0.6 });
  var ringGlow = new THREE.Mesh(geoRing, matRing);
  ringGlow.position.y = -5.2;
  ringGlow.rotation.x = Math.PI / 2;
  pillarGroup.add(ringGlow);

  /* ── ФОНОВЫЕ ПИКИ/СИЛУЭТЫ (5-8 гор вокруг) ── */
  var peakTextures = ['img/034.jpg', 'img/048.jpg', 'img/055.jpg'];
  var peakTxList = [];
  peakTextures.forEach(function(src) {
    txLoader.load(src, function(tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      peakTxList.push(tex);
    });
  });

  var bgPeaks = [];
  /* Параметры: [угол, дистанция, высота, ширина масштаб] */
  var peakParams = [
    [0.4,  22, 0.0, 1.2],
    [1.1,  28, -1.0, 0.9],
    [2.0,  18, 0.5, 1.4],
    [3.0,  25, -0.5, 1.0],
    [3.9,  20, 0.0, 1.1],
    [4.8,  30, -1.0, 0.85],
    [5.6,  22, 0.5, 1.3],
  ];

  peakParams.forEach(function(p, idx) {
    var angle = p[0], dist = p[1], baseY = p[2], scale = p[3];
    var peakGroup = new THREE.Group();

    /* Силуэт пика — вытянутый конус */
    var peakH = (8.0 + Math.random() * 6.0) * scale;
    var peakR = (0.8 + Math.random() * 0.6) * scale;
    var geoPeak = makeRockySection(0.05, peakR, peakH, 4);

    /* Тёмный матовый материал — тонет в тумане */
    var matPeak = new THREE.MeshStandardMaterial({
      color: new THREE.Color(0.04 + Math.random()*0.03, 0.06 + Math.random()*0.04, 0.04 + Math.random()*0.03),
      roughness: 0.98,
      metalness: 0.0,
    });

    /* Иногда добавляем приглушённую текстуру */
    if (peakTxList.length > 0 && idx % 2 === 0) {
      matPeak.map = peakTxList[idx % peakTxList.length];
      matPeak.color = new THREE.Color(0.15, 0.18, 0.13);
    }

    var meshPeak = new THREE.Mesh(geoPeak, matPeak);
    meshPeak.position.y = baseY + peakH * 0.5 - 5.0;
    peakGroup.add(meshPeak);

    peakGroup.position.set(
      Math.cos(angle) * dist,
      0,
      Math.sin(angle) * dist
    );
    scene.add(peakGroup);
    bgPeaks.push(peakGroup);
  });

  /* ── АТМОСФЕРНЫЙ ТУМАН У ОСНОВАНИЯ (плоскость) ── */
  var geoMist = new THREE.PlaneGeometry(80, 40);
  var matMist = new THREE.MeshBasicMaterial({
    color: 0x0d1518,
    transparent: true,
    opacity: 0.88,
    depthWrite: false,
  });
  var mistPlane = new THREE.Mesh(geoMist, matMist);
  mistPlane.rotation.x = -Math.PI / 2;
  mistPlane.position.y = -6.0;
  scene.add(mistPlane);

  /* ── КОЛЬЦО ФОТОГРАФИЙ ── */
  var photoFiles = (typeof PHOTO_DATA !== 'undefined' && PHOTO_DATA.length > 0)
    ? PHOTO_DATA
    : [
        'img/034.jpg', 'img/035.jpg', 'img/039.jpg', 'img/040.jpg',
        'img/042.jpg', 'img/048.jpg', 'img/053.jpg', 'img/054.jpg',
        'img/055.jpg', 'img/073.jpg', 'img/082.jpg', 'img/089.jpg',
        'img/090.jpg'
      ];

  var photoGroup = new THREE.Group();
  scene.add(photoGroup);

  var loadingManager = new THREE.LoadingManager();
  var loader = new THREE.TextureLoader(loadingManager);

  var N = photoFiles.length;
  var ringRadius = isMobile ? 3.0 : 5.2;
  var photoW = isMobile ? 0.9 : 1.4;
  var photoH = photoW * 1.35;

  photoFiles.forEach(function(file, idx) {
    var angle = (idx / N) * Math.PI * 2;

    /* Два яруса */
    var yOffset = isMobile
      ? ((idx % 2 === 0) ? 3.0 : 1.5)
      : ((idx % 2 === 0) ? 2.0 : 0.5);
    var radiusVar = ringRadius + (idx % 3 === 0 ? 0.4 : 0);

    var x = Math.sin(angle) * radiusVar;
    var z = Math.cos(angle) * radiusVar;

    var group = new THREE.Group();
    group.position.set(x, yOffset, z);
    group.rotation.y = angle + Math.PI;

    /* Тонкая тёмная рамка */
    var frameGeo = new THREE.PlaneGeometry(photoW + 0.05, photoH + 0.05);
    var frameMesh = new THREE.Mesh(frameGeo, new THREE.MeshBasicMaterial({ color: 0x223322, side: THREE.FrontSide }));
    group.add(frameMesh);

    /* Свечение рамки — атмосферный зелёный */
    var glowGeo = new THREE.PlaneGeometry(photoW + 0.14, photoH + 0.14);
    var glowMesh = new THREE.Mesh(glowGeo, new THREE.MeshBasicMaterial({
      color: 0x44ff88,
      transparent: true,
      opacity: 0.12,
      side: THREE.FrontSide,
      depthWrite: false,
    }));
    glowMesh.position.z = -0.01;
    group.add(glowMesh);

    /* Плоскость фото */
    var photoGeo = new THREE.PlaneGeometry(photoW, photoH);
    var photoMat = new THREE.MeshStandardMaterial({
      roughness: 0.55,
      metalness: 0.0,
      color: 0xffffff,
    });

    var photoMesh = new THREE.Mesh(photoGeo, photoMat);
    photoMesh.position.z = 0.002;
    group.add(photoMesh);

    loader.load(
      file,
      function(mesh, mat) {
        return function(texture) {
          texture.encoding = THREE.sRGBEncoding;
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          mat.map = texture;
          mat.needsUpdate = true;
        };
      }(photoMesh, photoMat),
      undefined,
      function(err) { console.warn('Texture load error:', file, err); }
    );

    photoGroup.add(group);
  });

  /* ── ЧАСТИЦЫ — ТУМАННАЯ ПЫЛЬ ПАРКА ── */
  var starGeo = new THREE.BufferGeometry();
  var starCount = isMobile ? 600 : 1200;
  var starPos = new Float32Array(starCount * 3);
  for (var s = 0; s < starCount; s++) {
    /* Частицы ближе к сцене, не в бесконечности */
    starPos[s*3]   = (Math.random() - 0.5) * 80;
    starPos[s*3+1] = (Math.random() - 0.5) * 50 + 5;
    starPos[s*3+2] = (Math.random() - 0.5) * 60;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({
    color: 0xaaffcc,
    size: 0.05,
    transparent: true,
    opacity: 0.28
  });
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  /* ── ОРБИТАЛЬНЫЙ ОБЛЁТ КАМЕРЫ ── */
  /* Период ~35с, плавный кинематографичный облёт */
  var orbitPeriod = 35.0; /* секунд на оборот */
  var orbitBobAmp = 0.8;  /* амплитуда покачивания по высоте */
  var orbitBobPeriod = 12.0; /* период покачивания */

  /* Mouse parallax */
  var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', function(e) {
    mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── CURSOR ── */
  var dot  = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  var cx = 0, cy = 0, rx = 0, ry = 0;
  window.addEventListener('mousemove', function(e) { cx = e.clientX; cy = e.clientY; });

  var clock = new THREE.Clock();

  /* ── ANIMATE ── */
  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    /* Столб медленно вращается */
    pillarGroup.rotation.y = t * 0.015;

    /* Кольцо фото — в другую сторону */
    photoGroup.rotation.y = -t * 0.018;
    photoGroup.rotation.x = Math.sin(t * 0.28) * 0.025;

    /* Пульсация кольца основания */
    matRing.opacity = 0.4 + Math.sin(t * 1.6) * 0.22;
    pointBottom.intensity = 1.8 + Math.sin(t * 1.1) * 0.5;
    pointFog.intensity = 1.2 + Math.sin(t * 0.7 + 1.0) * 0.4;

    /* ── ОРБИТАЛЬНЫЙ ОБЛЁТ ── */
    var orbitAngle = (t / orbitPeriod) * Math.PI * 2;
    /* Покачивание по высоте — парение */
    var bobY = orbitHeight + Math.sin(t / orbitBobPeriod * Math.PI * 2) * orbitBobAmp;
    /* Лёгкое изменение радиуса — зум-эффект */
    var currentRadius = orbitRadius + Math.sin(t * 0.17) * 1.5;

    var camX = Math.cos(orbitAngle) * currentRadius;
    var camZ = Math.sin(orbitAngle) * currentRadius;

    /* Подмешиваем mouse parallax */
    mouse.x += (mouse.tx - mouse.x) * 0.035;
    mouse.y += (mouse.ty - mouse.y) * 0.035;

    if (!isMobile) {
      camX += mouse.x * 0.8;
      camZ += mouse.y * 0.4;
    }

    camera.position.set(camX, bobY, camZ);
    /* Камера смотрит немного выше центра — на середину столба */
    camera.lookAt(0, 2.5, 0);

    /* pillarSpot следует за камерой — текстура скалы всегда освещена */
    pillarSpot.position.set(camX * 0.7, bobY + 2.0, camZ * 0.7);

    /* Лёгкое движение частиц */
    stars.rotation.y = t * 0.006;
    stars.rotation.x = t * 0.002;

    renderer.render(scene, camera);

    /* Cursor */
    if (dot)  { dot.style.left = cx + 'px'; dot.style.top = cy + 'px'; }
    if (ring) {
      rx += (cx - rx) * 0.11;
      ry += (cy - ry) * 0.11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
    }
  }
  animate();

})();

/* ═══════════════════════════════════════════════
   LOADER
═══════════════════════════════════════════════ */
(function() {
  if (document.documentElement.getAttribute('data-sl') === '1') return;

  var loaderEl  = document.getElementById('loader');
  var counterEl = document.getElementById('loader-count');
  var heroEl    = document.getElementById('hero');

  var T = 2400;
  var t0 = performance.now();
  (function tick(now) {
    var p = Math.min((now - t0) / T, 1);
    var e = p < .5 ? 2*p*p : -1 + (4 - 2*p)*p;
    counterEl.textContent = String(Math.floor(e * 100)).padStart(3, '0') + '%';
    if (p < 1) requestAnimationFrame(tick);
    else counterEl.textContent = '100%';
  })(performance.now());

  setTimeout(function() {
    if (typeof gsap !== 'undefined') {
      var W = window.innerWidth, H = window.innerHeight;
      var sv = (Math.max(W, H, 1920) / Math.min(W, H)) * 22;
      gsap.timeline()
        .to(loaderEl, { rotate: 180, scale: sv, duration: 0.85, ease: 'power3.in' })
        .to(loaderEl, { opacity: 0, duration: 0.3, ease: 'power2.out',
            onComplete: function() { loaderEl.style.display = 'none'; } }, '-=0.15')
        .to(heroEl,   { opacity: 1, duration: 0.7, ease: 'power2.out' }, '-=0.3');
    } else {
      loaderEl.style.display = 'none';
      heroEl.style.opacity = '1';
    }
  }, 2600);
})();
</script>
</body>
