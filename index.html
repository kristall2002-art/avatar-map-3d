*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #0d0d10;
  --text: #ffffde;
  --acc:  #e8fe25;
  --mint: #25fea8;

html, body {

  color: var(--text);
  font-family: var(--fb);

/* ── CURSOR ── */

  position: fixed; top: 0; left: 0; z-index: 9999;
  width: 8px; height: 8px;
  background: var(--acc);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);

#cur-ring {
  position: fixed; top: 0; left: 0; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,222,.5);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
@media (pointer: coarse) {
  #cur-dot, #cur-ring { display: none; }
  html, body { cursor: auto; }

  position: fixed; inset: 0; z-index: 1000;

#hero::after {

  position: absolute;
  bottom: 0; left: 0;
  width: 60%; height: 55%;

/* тонкая сетка */

    linear-gradient(rgba(255,255,222,.022) 1px, transparent 1px),

.hi { position: relative; z-index: 1; display: block; }

/* ── MOBILE ── */
@media (max-width: 767px) {
  #hero {

<script>
/* ═══════════════════════════════════════════════
   PILLAR VERTEX SHADER
═══════════════════════════════════════════════ */
var PILLAR_VS = [
'precision highp float;',
'uniform float uTime;',
'varying vec3 vNormal;',
'varying vec3 vPos;',
'varying float vY;',

/* Simplex 3D noise — лёгкая неровность поверхности */
'vec3 m3(vec3 x){return x-floor(x*(1./289.))*289.;}',
'vec4 m4(vec4 x){return x-floor(x*(1./289.))*289.;}',
'vec4 pm(vec4 x){return m4(((x*34.)+1.)*x);}',
'vec4 ts(vec4 r){return 1.79284291400159-0.85373472095314*r;}',
'float sn3(vec3 v){',
'  const vec2 C=vec2(1./6.,1./3.);',
'  const vec4 D=vec4(0.,.5,1.,2.);',
'  vec3 i=floor(v+dot(v,C.yyy));',
'  vec3 x0=v-i+dot(i,C.xxx);',
'  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;',
'  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);',
'  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;',
'  i=m3(i);',
'  vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));',
'  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;',
'  vec4 j=p-49.*floor(p*ns.z*ns.z);',
'  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);',
'  vec4 xs=x_*ns.x+ns.yyyy;vec4 ys=y_*ns.x+ns.yyyy;',
'  vec4 h=1.-abs(xs)-abs(ys);',
'  vec4 b0=vec4(xs.xy,ys.xy);vec4 b1=vec4(xs.zw,ys.zw);',
'  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;',
'  vec4 sh=-step(h,vec4(0.));',
'  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
'  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);',
'  vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);',
'  vec4 nm=ts(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
'  p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;',
'  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);',
'  m=m*m;',
'  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
'}',

'void main(){',
'  vNormal = normal;',
'  vY = position.y;',
'  float n = sn3(position * 1.2 + uTime * 0.08);',
'  vec3 pos = position + normal * n * 0.04;',
'  vPos = pos;',
'  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
'}'
].join('\n');

var PILLAR_FS = [
'precision highp float;',
'uniform float uTime;',
'varying vec3 vNormal;',
'varying vec3 vPos;',
'varying float vY;',

'void main(){',
'  vec3 n = normalize(vNormal);',
'  vec3 viewDir = normalize(cameraPosition - vPos);',

  /* Каменный цвет: очень тёмный внизу, чуть светлее вверху */
'  float t = clamp((vY + 6.0) / 12.0, 0.0, 1.0);',
'  vec3 darkStone = vec3(0.05, 0.04, 0.06);',
'  vec3 lightStone = vec3(0.18, 0.15, 0.20);',
'  vec3 col = mix(darkStone, lightStone, t);',

  /* Diffuse */
'  vec3 light1 = normalize(vec3(0.5, 1.5, 2.0));',
'  vec3 light2 = normalize(vec3(-1.0, 0.5, 1.5));',
'  float diff1 = max(dot(n, light1), 0.0);',
'  float diff2 = max(dot(n, light2), 0.0) * 0.4;',
'  col += diff1 * vec3(0.12, 0.10, 0.15) * 0.9;',
'  col += diff2 * vec3(0.08, 0.10, 0.18);',

  /* Accent glow сверху (неон-лимон) */
'  float topGlow = smoothstep(0.4, 1.0, t);',
'  col += topGlow * vec3(0.55, 0.62, 0.05) * 0.35;',

  /* Fresnel rim — акцентный цвет */
'  float fr = pow(1.0 - max(dot(viewDir, n), 0.0), 3.0);',
'  col += fr * vec3(0.91, 0.996, 0.145) * 0.5;',

  /* Specular highlight */
'  vec3 hv = normalize(light1 + viewDir);',
'  float sp = pow(max(dot(n, hv), 0.0), 64.0);',
'  col += sp * vec3(0.8, 0.9, 0.5) * 0.4;',

'  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
'}'
].join('\n');

/* ═══════════════════════════════════════════════
   THREE.JS SCENE — PILLAR + ORBITING PHOTOS
═══════════════════════════════════════════════ */
(function() {
  var isMobile = window.innerWidth < 768;
  var dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 1.5);
  var canvas = document.getElementById('gl');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !isMobile, alpha: false });
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = false;
  } catch(e) {
    console.warn('WebGL failed:', e);
    canvas.style.display = 'none';
    renderer = null;
  }
  if (!renderer) return;

  /* ── CAMERA ── */
  var fov = isMobile ? 50 : 38;
  var camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 200);
  /* Камера снизу-сбоку, смотрит вверх на столб */
  if (isMobile) {
    camera.position.set(0, -1.5, 11);
    camera.lookAt(0, 2.0, 0);
  } else {
    /* Камера снизу, смотрит на столб */
    camera.position.set(0, -2.0, 13);
    camera.lookAt(0, 2.0, 0);
  }

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0d10);
  scene.fog = new THREE.FogExp2(0x0d0d10, 0.028);

  /* ── LIGHTS ── */
  var ambient = new THREE.AmbientLight(0x1a1025, 0.8);
  scene.add(ambient);

  /* Основной направленный свет — сбоку и сверху */
  var dirLight = new THREE.DirectionalLight(0xd0c8ff, 1.0);
  dirLight.position.set(3, 8, 5);
  scene.add(dirLight);

  /* Подсветка столба снизу — тёплый */
  var pointBottom = new THREE.PointLight(0xe8fe25, 1.5, 8, 2);
  pointBottom.position.set(0, -3, 0);
  scene.add(pointBottom);

  /* Подсветка столба сверху — холодный акцент */
  var pointTop = new THREE.PointLight(0x88bbff, 1.2, 12, 2);
  pointTop.position.set(0.5, 7, 1);
  scene.add(pointTop);

  /* Rim-свет сзади — силуэт столба */
  var rimLight = new THREE.DirectionalLight(0xe8fe25, 0.4);
  rimLight.position.set(-2, 3, -5);
  scene.add(rimLight);

  /* Root-группа: смещаем всю конструкцию на десктопе вправо */
  var sceneRoot = new THREE.Group();
  sceneRoot.position.x = isMobile ? 0 : 2.5;
  sceneRoot.position.y = isMobile ? 0 : 0;
  scene.add(sceneRoot);

  /* ── ЦЕНТРАЛЬНЫЙ СТОЛБ ── */
  var pillarGroup = new THREE.Group();
  sceneRoot.add(pillarGroup);

  /* Основной монолит: высокий и тонкий */
  /* Используем несколько сегментов для неровности */
  var seg = isMobile ? 8 : 12;

  /* Основная колонна */
  var geoMain = new THREE.CylinderGeometry(0.22, 0.30, 10.0, seg, 6, false);
  /* Немного деформируем вершины для каменного вида */
  var posAttr = geoMain.attributes.position;
  for (var i = 0; i < posAttr.count; i++) {
    var px = posAttr.getX(i);
    var py = posAttr.getY(i);
    var pz = posAttr.getZ(i);
    /* Случайная скальная неровность */
    var seed = px * 13.7 + py * 7.3 + pz * 19.1;
    var jitter = (Math.sin(seed) * 0.5 + Math.cos(seed * 2.3) * 0.3) * 0.05;
    posAttr.setX(i, px + jitter);
    posAttr.setZ(i, pz + jitter);
  }
  geoMain.computeVertexNormals();

  var pillarUniforms = {
    uTime: { value: 0 },
  };
  var matPillar = new THREE.ShaderMaterial({
    vertexShader: PILLAR_VS,
    fragmentShader: PILLAR_FS,
    uniforms: pillarUniforms,
  });

  var meshMain = new THREE.Mesh(geoMain, matPillar);
  meshMain.position.y = 0;
  pillarGroup.add(meshMain);

  /* Вершина столба — чуть уже, острее */
  var geoCap = new THREE.CylinderGeometry(0.04, 0.20, 2.5, seg, 3, false);
  var posCapAttr = geoCap.attributes.position;
  for (var i = 0; i < posCapAttr.count; i++) {
    var px2 = posCapAttr.getX(i);
    var py2 = posCapAttr.getY(i);
    var pz2 = posCapAttr.getZ(i);
    var seed2 = px2 * 11.3 + py2 * 9.7 + pz2 * 17.3;
    var jitter2 = (Math.sin(seed2) * 0.5 + Math.cos(seed2 * 2.1) * 0.3) * 0.04;
    posCapAttr.setX(i, px2 + jitter2);
    posCapAttr.setZ(i, pz2 + jitter2);
  }
  geoCap.computeVertexNormals();

  var meshCap = new THREE.Mesh(geoCap, matPillar);
  meshCap.position.y = 6.25;
  pillarGroup.add(meshCap);

  /* Основание — чуть шире */
  var geoBase = new THREE.CylinderGeometry(0.30, 0.40, 2.0, seg, 2, false);
  var matBase = new THREE.MeshStandardMaterial({
    color: 0x0d0c10,
    roughness: 0.95,
    metalness: 0.05,
  });
  var meshBase = new THREE.Mesh(geoBase, matBase);
  meshBase.position.y = -6.0;
  pillarGroup.add(meshBase);

  /* Светящееся кольцо вокруг основания столба */
  var geoRing = new THREE.TorusGeometry(0.45, 0.015, 8, 64);
  var matRing = new THREE.MeshBasicMaterial({ color: 0xe8fe25, transparent: true, opacity: 0.7 });
  var ringGlow = new THREE.Mesh(geoRing, matRing);
  ringGlow.position.y = -4.8;
  ringGlow.rotation.x = Math.PI / 2;
  pillarGroup.add(ringGlow);

  /* ── ОТРАЖАЮЩИЙ ПОЛ ── */
  var geoFloor = new THREE.PlaneGeometry(60, 60);
  var matFloor = new THREE.MeshStandardMaterial({
    color: 0x0a0a0d,
    roughness: 0.1,
    metalness: 0.85,
    envMapIntensity: 0.3,
  });
  var floor = new THREE.Mesh(geoFloor, matFloor);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -5.2;
  sceneRoot.add(floor);

  /* ── ТУМАН У ОСНОВАНИЯ ── */
  var geoMist = new THREE.PlaneGeometry(20, 8);
  var matMist = new THREE.MeshBasicMaterial({
    color: 0x0d0d10,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
  });
  var mistPlane = new THREE.Mesh(geoMist, matMist);
  mistPlane.rotation.x = -Math.PI / 2;
  mistPlane.position.y = -4.8;
  sceneRoot.add(mistPlane);

  /* ── КОЛЬЦО ФОТОГРАФИЙ ── */
  /* PHOTO_DATA — base64 inline (работает и на file:// и на https) */
  /* Fallback: если base64 нет — берём img/*.jpg (для живого сайта) */
  var photoFiles = (typeof PHOTO_DATA !== 'undefined' && PHOTO_DATA.length > 0)
    ? PHOTO_DATA
    : [
        'img/034.jpg', 'img/035.jpg', 'img/039.jpg', 'img/040.jpg',
        'img/042.jpg', 'img/048.jpg', 'img/053.jpg', 'img/054.jpg',
        'img/055.jpg', 'img/073.jpg', 'img/082.jpg', 'img/089.jpg',
        'img/090.jpg'
      ];

  var photoGroup = new THREE.Group();
  sceneRoot.add(photoGroup);

  /* LoadingManager — отслеживаем все текстуры */
  var loadingManager = new THREE.LoadingManager();
  var allTexturesLoaded = false;
  loadingManager.onLoad = function() {
    allTexturesLoaded = true;
  };
  var loader = new THREE.TextureLoader(loadingManager);

  /* Параметры кольца */
  var N = photoFiles.length;
  var ringRadius = isMobile ? 2.8 : 4.6;
  var photoW = isMobile ? 0.95 : 1.55;
  var photoH = photoW * 1.35; /* вертикальные фото */

  /* Материал рамки */
  function makeFrameMat() {
    return new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.FrontSide, transparent: true, opacity: 0.9 });
  }
  function makeGlowMat() {
    return new THREE.MeshBasicMaterial({
      color: 0xe8fe25,
      transparent: true,
      opacity: 0.15,
      side: THREE.FrontSide,
      depthWrite: false,
    });
  }

  photoFiles.forEach(function(file, idx) {
    var angle = (idx / N) * Math.PI * 2;

    /* Позиция: два яруса — верхнее и нижнее кольцо */
    var yOffset = isMobile
      ? ((idx % 2 === 0) ? 3.5 : 2.0)
      : ((idx % 2 === 0) ? 1.8 : 0.3);
    var radiusVar = ringRadius + (idx % 3 === 0 ? 0.3 : 0);

    var x = Math.sin(angle) * radiusVar;
    var z = Math.cos(angle) * radiusVar;

    /* Группа для одного фото */
    var group = new THREE.Group();
    group.position.set(x, yOffset, z);
    /* Лицом к центру (к столбу) — разворачиваем наружу от оси */
    group.rotation.y = angle + Math.PI;

    /* Тонкая рамка */
    var frameGeo = new THREE.PlaneGeometry(photoW + 0.04, photoH + 0.04);
    var frameMesh = new THREE.Mesh(frameGeo, makeFrameMat());
    group.add(frameMesh);

    /* Лёгкое свечение рамки */
    var glowGeo = new THREE.PlaneGeometry(photoW + 0.12, photoH + 0.12);
    var glowMesh = new THREE.Mesh(glowGeo, makeGlowMat());
    glowMesh.position.z = -0.01;
    group.add(glowMesh);

    /* Плоскость фото */
    var photoGeo = new THREE.PlaneGeometry(photoW, photoH);
    var photoMat = new THREE.MeshStandardMaterial({
      roughness: 0.6,
      metalness: 0.0,
      color: 0xffffff,
    });

    var photoMesh = new THREE.Mesh(photoGeo, photoMat);
    photoMesh.position.z = 0.002;
    group.add(photoMesh);

    /* Загрузка текстуры через менеджер */
    loader.load(
      file,
      function(mesh, mat) {
        return function(texture) {
          texture.encoding = THREE.sRGBEncoding;
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          mat.map = texture;
          mat.needsUpdate = true;
        };
      }(photoMesh, photoMat),
      undefined,
      function(err) {
        console.warn('Texture load error:', file, err);
      }
    );

    photoGroup.add(group);
  });

  /* Частицы — звёздная пыль */
  var starGeo = new THREE.BufferGeometry();
  var starCount = isMobile ? 400 : 800;
  var starPos = new Float32Array(starCount * 3);
  for (var s = 0; s < starCount; s++) {
    starPos[s*3]   = (Math.random() - 0.5) * 60;
    starPos[s*3+1] = (Math.random() - 0.5) * 40;
    starPos[s*3+2] = (Math.random() - 0.5) * 40 - 10;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({ color: 0xffffde, size: 0.06, transparent: true, opacity: 0.35 });
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  /* ── MOUSE PARALLAX ── */
  var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', function(e) {
    mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── CURSOR ── */
  var dot  = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  var cx = 0, cy = 0, rx = 0, ry = 0;
  window.addEventListener('mousemove', function(e) { cx = e.clientX; cy = e.clientY; });

  var clock = new THREE.Clock();

  /* ── ANIMATE ── */
  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    /* Обновляем uniforms шейдера столба */
    pillarUniforms.uTime.value = t;

    /* Столб медленно вращается вокруг Y */
    pillarGroup.rotation.y += 0.004;

    /* Кольцо фото вращается чуть быстрее В ДРУГУЮ СТОРОНУ */
    photoGroup.rotation.y -= 0.006;

    /* Лёгкое покачивание кольца фото */
    photoGroup.rotation.x = Math.sin(t * 0.3) * 0.03;

    /* Пульсация кольца основания */
    matRing.opacity = 0.45 + Math.sin(t * 1.8) * 0.25;
    pointBottom.intensity = 1.2 + Math.sin(t * 1.2) * 0.4;

    /* Mouse parallax — камера */
    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;

    if (!isMobile) {
      /* Лёгкий параллакс через смещение камеры */
      camera.position.x = mouse.x * 0.6;
      camera.position.y = -2.0 + mouse.y * 0.4;
      camera.lookAt(2.5, 2.0, 0);
    }

    /* Лёгкое движение звёзд */
    stars.rotation.y = t * 0.008;
    stars.rotation.x = t * 0.003;

    renderer.render(scene, camera);

    /* Cursor */
    if (dot)  { dot.style.left = cx + 'px'; dot.style.top = cy + 'px'; }
    if (ring) {
      rx += (cx - rx) * 0.11;
      ry += (cy - ry) * 0.11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
    }
  }
  animate();

})();

/* ═══════════════════════════════════════════════
   LOADER
═══════════════════════════════════════════════ */
(function() {
  if (document.documentElement.getAttribute('data-sl') === '1') return;

  var loaderEl  = document.getElementById('loader');
  var counterEl = document.getElementById('loader-count');
  var heroEl    = document.getElementById('hero');

  var T = 2400;
  var t0 = performance.now();
  (function tick(now) {
    var p = Math.min((now - t0) / T, 1);
    var e = p < .5 ? 2*p*p : -1 + (4 - 2*p)*p;
    counterEl.textContent = String(Math.floor(e * 100)).padStart(3, '0') + '%';
    if (p < 1) requestAnimationFrame(tick);
    else counterEl.textContent = '100%';
  })(performance.now());

  setTimeout(function() {
    if (typeof gsap !== 'undefined') {
      var W = window.innerWidth, H = window.innerHeight;
      var sv = (Math.max(W, H, 1920) / Math.min(W, H)) * 22;
      gsap.timeline()
        .to(loaderEl, { rotate: 180, scale: sv, duration: 0.85, ease: 'power3.in' })
        .to(loaderEl, { opacity: 0, duration: 0.3, ease: 'power2.out',
            onComplete: function() { loaderEl.style.display = 'none'; } }, '-=0.15')
        .to(heroEl,   { opacity: 1, duration: 0.7, ease: 'power2.out' }, '-=0.3');
    } else {
      loaderEl.style.display = 'none';
      heroEl.style.opacity = '1';
    }
  }, 2600);
})();
</script>
</body>
</html>
