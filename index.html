<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════════════
   SIMPLEX NOISE GLSL (Ashima Arts / Stefan Gustavson)
   ════════════════════════════════════════════════════════ */
const SIMPLEX_GLSL = /* glsl */`
// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }

float snoise2(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                      -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                   + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

// Simplex 3D noise
vec4 permute3(vec4 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise3(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289_3(i);
  vec4 p = permute3(permute3(permute3(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

vec3 mod289_3(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289_4(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
`;

/* ════════════════════════════════════════════════════════
   VERTEX SHADER
   ════════════════════════════════════════════════════════ */
const vertexShader = /* glsl */`
uniform float uTime;
uniform float uDistort;
varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

// Inline simplex noise helpers
vec3 mod289v3(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289v4(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute4(vec4 x) { return mod289v4(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt4(vec4 r) { return 1.79284291400159 - 0.85373472095314*r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289v3(i);
  vec4 p = permute4(permute4(permute4(
    i.z + vec4(0.0, i1.z, i2.z, 1.0)) +
    i.y + vec4(0.0, i1.y, i2.y, 1.0)) +
    i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt4(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

void main() {
  vUv = uv;
  vNormal = normal;

  vec3 pos = position;

  // 3D simplex noise деформация — bump по нормали
  float noiseFreq = 1.8;
  float noiseAmp  = 0.38 * uDistort;
  vec3  noiseInput = pos * noiseFreq + uTime * 0.25;
  float n = snoise(noiseInput);
  pos += normal * n * noiseAmp;

  // Волна по оси Z (из спецификации оригинала)
  pos.z += sin(pos.x * 20.0 + uTime * 3.0) * 0.05;

  // Медленная пульсирующая волна
  pos += normal * sin(uTime * 0.6 + pos.y * 3.0) * 0.04;

  vPosition = pos;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}
`;

/* ════════════════════════════════════════════════════════
   FRAGMENT SHADER
   ════════════════════════════════════════════════════════ */
const fragmentShader = /* glsl */`
uniform float uTime;
uniform vec3  uBrightColor;
uniform vec3  uDarkColor;
uniform vec2  uResolution;
varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;

// Simplex 2D noise
vec3 permute2(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise2d(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                      -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute2(permute2(i.y + vec3(0.0, i1.y, 1.0))
                   + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x2 = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x2) - 0.5;
  vec3 ox = floor(x2 + 0.5);
  vec3 a0 = x2 - ox;
  m *= 1.79284291400159 - 0.85373472095314*(a0*a0 + h*h);
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

// Hash для grain
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

void main() {
  // Noise для раскраски поверхности
  float n = snoise2d(vPosition.xy * 2.0 + uTime * 0.15);
  n = n * 0.5 + 0.5; // 0..1

  // Rim lighting (подсветка по краям)
  vec3 viewDir = normalize(cameraPosition - vPosition);
  float rim = 1.0 - max(dot(viewDir, normalize(vNormal)), 0.0);
  rim = pow(rim, 2.5);

  // Микс двух цветов по noise
  vec3 col = mix(uDarkColor, uBrightColor, n);

  // Rim accent — добавляем неоновый акцент по краю
  col += rim * uBrightColor * 0.45;

  // Grain (плёнка)
  vec2 grainUv = gl_FragCoord.xy / uResolution;
  float grain = hash(grainUv + fract(uTime * 0.05)) * 0.08;
  col += grain - 0.04;

  // Небольшое ambient свечение
  col = clamp(col, 0.0, 1.0);

  gl_FragColor = vec4(col, 1.0);
}
`;

/* ════════════════════════════════════════════════════════
   THREE.JS SETUP
   ════════════════════════════════════════════════════════ */
const canvas = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});

// DPR ограничиваем [1, 1.5] как в оригинале
const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(dpr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

// Камера: position [0,0,8], fov 30 — точно как в оригинале
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 8);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1d1d1d');

// Шар — IcosahedronGeometry высокой детализации
// На мобилке меньше деталей для FPS
const isMobile = window.innerWidth < 768;
const sphereDetail = isMobile ? 64 : 128;
const geometry = new THREE.SphereGeometry(1.8, sphereDetail, sphereDetail);

// Uniforms
const uniforms = {
  uTime:        { value: 0 },
  uDistort:     { value: 1.0 },
  uBrightColor: { value: new THREE.Color('#69D2B7') }, // мятный
  uDarkColor:   { value: new THREE.Color('#1d2d38') }, // тёмно-синий/угольный
  uResolution:  { value: new THREE.Vector2(window.innerWidth * dpr, window.innerHeight * dpr) },
};

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms,
  side: THREE.FrontSide,
});

const sphere = new THREE.Mesh(geometry, material);
sphere.position.set(0, 0, 0);
scene.add(sphere);

// Мягкий ambient свет
const ambient = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambient);

/* ════════════════════════════════════════════════════════
   МЫШЬ / ПАРАЛЛАКС
   ════════════════════════════════════════════════════════ */
const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

window.addEventListener('mousemove', (e) => {
  mouse.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.targetY = -(e.clientY / window.innerHeight - 0.5) * 2;
});

/* ════════════════════════════════════════════════════════
   КАСТОМНЫЙ КУРСОР
   ════════════════════════════════════════════════════════ */
const cursorDot  = document.getElementById('cursor-dot');
const cursorRing = document.getElementById('cursor-ring');
let cursorX = 0, cursorY = 0;
let ringX = 0, ringY = 0;

window.addEventListener('mousemove', (e) => {
  cursorX = e.clientX;
  cursorY = e.clientY;
});

/* ════════════════════════════════════════════════════════
   RESIZE
   ════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uResolution.value.set(window.innerWidth * dpr, window.innerHeight * dpr);
});

/* ════════════════════════════════════════════════════════
   LENIS SMOOTH SCROLL
   ════════════════════════════════════════════════════════ */
let lenis;
try {
  lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
} catch(e) {
  console.warn('Lenis not loaded:', e);
}

/* ════════════════════════════════════════════════════════
   ANIMATE LOOP
   ════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  uniforms.uTime.value = elapsed;

  // Медленное вращение шара
  sphere.rotation.y += 0.004;
  sphere.rotation.x += 0.001;

  // Параллакс: шар слегка тянется к курсору (плавно)
  mouse.x += (mouse.targetX - mouse.x) * 0.05;
  mouse.y += (mouse.targetY - mouse.y) * 0.05;
  sphere.position.x = mouse.x * 0.3;
  sphere.position.y = mouse.y * 0.2;

  // Курсор-точка (мгновенный)
  if (cursorDot) {
    cursorDot.style.left = cursorX + 'px';
    cursorDot.style.top  = cursorY + 'px';
  }

  // Курсор-кольцо (с отставанием)
  if (cursorRing) {
    ringX += (cursorX - ringX) * 0.12;
    ringY += (cursorY - ringY) * 0.12;
    cursorRing.style.left = ringX + 'px';
    cursorRing.style.top  = ringY + 'px';
  }

  // Lenis tick
  if (lenis) lenis.raf(elapsed * 1000);

  renderer.render(scene, camera);
}

/* ════════════════════════════════════════════════════════
   LOADING SCREEN — GSAP ВОРОНКА
   ════════════════════════════════════════════════════════ */
const counterEl    = document.getElementById('loading-counter');
const loadingScreen = document.getElementById('loading-screen');
const hero          = document.getElementById('hero');

let ballReady = false;
let counterDone = false;
let count = 0;

// Ждём первый рендер шара
function markBallReady() {
  ballReady = true;
  tryReveal();
}

function tryReveal() {
  if (!ballReady || !counterDone) return;

  // GSAP Timeline: loading screen разворачивается как воронка
  const tl = gsap.timeline();
  const scaleVal = (Math.max(window.innerWidth, 1920) / window.innerWidth) * 20;

  tl.to(loadingScreen, {
    rotate: 180,
    scale: scaleVal,
    duration: 0.9,
    ease: 'power3.in',
  })
  .to(loadingScreen, {
    opacity: 0,
    duration: 0.35,
    ease: 'power2.out',
    onComplete: () => {
      loadingScreen.style.display = 'none';
    }
  }, '-=0.2')
  .to(hero, {
    opacity: 1,
    duration: 0.6,
    ease: 'power2.out',
  }, '-=0.4');
}

// Счётчик 0% → 100%
function runCounter() {
  const duration = 2200; // мс
  const start = performance.now();

  function tick(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    // easeInOut
    const eased = progress < 0.5
      ? 2 * progress * progress
      : -1 + (4 - 2 * progress) * progress;

    count = Math.floor(eased * 100);
    const str = String(count).padStart(3, '0') + '%';
    counterEl.textContent = str;

    if (progress < 1) {
      requestAnimationFrame(tick);
    } else {
      counterEl.textContent = '100%';
      counterDone = true;
      tryReveal();
    }
  }

  requestAnimationFrame(tick);
}

// Запуск: сначала один рендер, потом счётчик
function startScene() {
  animate(); // запускаем loop
  // Даём один кадр отрендериться
  setTimeout(() => {
    markBallReady();
  }, 300);
  runCounter();
}

// Ждём загрузки шрифтов
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startScene);
} else {
  setTimeout(startScene, 100);
}

</script>
