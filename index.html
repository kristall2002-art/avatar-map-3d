<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #0d1518;
  --text: #ffffde;
  --acc:  #e8fe25;
  --mint: #25fea8;
  --fd: 'Clash Display', 'Arial Black', Impact, sans-serif;
  --fb: 'Satoshi', 'Inter', system-ui, sans-serif;
}

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  cursor: none;
}

/* ── CURSOR ── */
#cur-dot {
  position: fixed; top: 0; left: 0; z-index: 9999;
  width: 8px; height: 8px;
  background: var(--acc);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
#cur-ring {
  position: fixed; top: 0; left: 0; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,222,.5);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
@media (pointer: coarse) {
  #cur-dot, #cur-ring { display: none; }
  html, body { cursor: auto; }
}

/* ── LOADING SCREEN ── */
#loader {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  transform-origin: center center;
}
#loader-count {
  font-family: var(--fd);
  font-size: clamp(5rem, 18vw, 13rem);
  font-weight: 700;
  color: var(--bg);
  letter-spacing: -0.04em;
  line-height: 1;
  user-select: none;
}

/* ── CANVAS ── */
#gl {
  position: fixed; top: 0; left: 0;
  width: 100dvw; height: 100dvh;
  z-index: 1;
  display: block;
}

/* ── HERO ── */
#hero {
  position: relative; z-index: 10;
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: clamp(1.2rem, 2.5vw, 2rem);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
}

/* Узкий градиент снизу под текстом */
#hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 55%; height: 42%;
  background: radial-gradient(ellipse at bottom left, rgba(13,21,24,.95) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* тонкая сетка */
#hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,222,.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,222,.012) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none; z-index: 0;
}

.hi { position: relative; z-index: 1; display: block; }

.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.8rem;
  font-family: var(--fd);
  font-size: clamp(.55rem, 1.0vw, .80rem);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text);
  opacity: .65;
}

.hero-title {
  font-family: var(--fd);
  font-size: clamp(1.8rem, 5vw, 4.8rem);
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: .88;
  text-transform: uppercase;
  color: var(--text);
  transform: scaleY(2);
  transform-origin: bottom center;
  display: block;
  margin-bottom: 1.6rem;
  pointer-events: auto;
}

.hero-cta {
  pointer-events: auto;
  display: inline-block;
  font-family: var(--fd);
  font-size: clamp(.6rem, 1.0vw, .85rem);
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--acc);
  padding: .65em 1.3em;
  text-decoration: none;
  cursor: none;
  transition: background .2s;
  margin-bottom: 2rem;
}
.hero-cta:hover { background: var(--text); }

/* Атрибуция Wikimedia */
#attribution {
  position: fixed;
  bottom: 8px; right: 12px;
  z-index: 20;
  font-size: 10px;
  color: rgba(255,255,222,0.38);
  font-family: var(--fb);
  pointer-events: none;
  letter-spacing: .03em;
}

/* ── MOBILE ── */
@media (max-width: 767px) {
  #hero {
    padding: 1rem 1rem;
    overflow: visible;
    justify-content: flex-end;
  }
  .hi {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .hero-title {
    font-size: clamp(1.6rem, 10vw, 3.2rem);
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
    transform-origin: bottom left;
    overflow: visible;
  }
  .hero-meta {
    font-size: clamp(.45rem, 2.8vw, .65rem);
    letter-spacing: .08em;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    margin-bottom: 0.6rem;
    opacity: .6;
    justify-content: flex-start;
  }
  .hero-meta span { display: block; }
  .hero-cta { margin-bottom: 1.2rem; }
  #hero::after {
    width: 90%; height: 40%;
  }
}

<!-- Three.js r128 UMD (global THREE) -->
<script src="./three.min.js"></script>
<!-- GSAP UMD -->
<script src="./gsap.min.js"></script>
<!-- Photo data — base64 inline, same-origin everywhere -->
<script src="./photos.js"></script>
<!-- Panorama & Pillar — base64 inline (same-origin, works in headless) -->
<script src="./panorama.js"></script>
<script src="./pillar.js"></script>

<!-- Postprocessing (Three.js r128 examples, локальные UMD-копии) -->
<script src="./CopyShader.js"></script>
<script src="./LuminosityHighPassShader.js"></script>
<script src="./EffectComposer.js"></script>
<script src="./RenderPass.js"></script>
<script src="./ShaderPass.js"></script>
<script src="./UnrealBloomPass.js"></script>

<script>
/* ═══════════════════════════════════════════════
   THREE.JS SCENE — Реальная панорама Чжанцзяцзе + реальный столб-фото
   Skybox: equirectangular 360° панорама парка (SphereGeometry BackSide)
   Центральный столб: реальное фото скалы (Вариант A — billboard)
   Туман FogExp2 под цвет панорамы
═══════════════════════════════════════════════ */
(function() {
  var isMobile = window.innerWidth < 768;
  var dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 1.5);
  var canvas = document.getElementById('gl');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: !isMobile,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = false;
  } catch(e) {
    console.warn('WebGL failed:', e);
    canvas.style.display = 'none';
    renderer = null;
  }
  if (!renderer) return;

  var scene = new THREE.Scene();
  /* Атмосферный туман — сизо-серо-зелёный, как дымка в ущелье Чжанцзяцзе */
  scene.fog = new THREE.FogExp2(0x3a4a3c, 0.028);

  /* ── CAMERA ── */
  var fov = isMobile ? 70 : 58;
  var camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 600);

  var orbitRadius = isMobile ? 6.0 : 9.0;
  var orbitHeight = isMobile ? 0.0 : -0.5;
  camera.position.set(orbitRadius, orbitHeight, 0);
  camera.lookAt(0, 2.0, 0);

  /* ── POSTPROCESSING ── */
  var composer = null;
  var useBloom = false;
  try {
    if (typeof THREE.EffectComposer !== 'undefined' &&
        typeof THREE.RenderPass !== 'undefined' &&
        typeof THREE.UnrealBloomPass !== 'undefined') {

      var renderTarget = new THREE.WebGLRenderTarget(
        window.innerWidth * dpr,
        window.innerHeight * dpr,
        {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
          encoding: THREE.sRGBEncoding
        }
      );

      composer = new THREE.EffectComposer(renderer, renderTarget);
      var renderPass = new THREE.RenderPass(scene, camera);
      composer.addPass(renderPass);

      var bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.45,  /* strength — мягкий bloom под природный свет */
        0.50,  /* radius */
        0.85   /* threshold */
      );
      composer.addPass(bloomPass);
      useBloom = true;
      console.log('[avatar3d] EffectComposer + UnrealBloomPass OK');
    }
  } catch(bloomErr) {
    composer = null; useBloom = false;
  }

  /* ── TEXTURE LOADER ── */
  var txLoader = new THREE.TextureLoader();

  /* ══════════════════════════════════════════════════
     SKYBOX — 360° панорама Чжанцзяцзе (equirectangular)
     Большая сфера, камера внутри, BackSide
  ════════════════════════════════════════════════ */
  var skyMesh = null;
  var panoLoaded = false;

  /* Используем base64 если доступна (headless/file://), иначе img-путь */
  var panoSrc = (typeof PANORAMA_B64 !== 'undefined' && PANORAMA_B64)
    ? PANORAMA_B64
    : 'img/panorama_zhangjiajie.jpg';

  txLoader.load(
    panoSrc,
    function(tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      /* Смещение — подбираем красивый ракурс: немного сдвигаем, чтобы столбы были видны */
      tex.offset.set(0.18, 0.0);

      var skyGeo = new THREE.SphereGeometry(380, 64, 32);
      var skyMat = new THREE.MeshBasicMaterial({
        map: tex,
        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
        fog: false,        /* панорама НЕ затуманивается — только foreground objects */
      });
      skyMesh = new THREE.Mesh(skyGeo, skyMat);
      /* Рендерим первым (за сценой) */
      skyMesh.renderOrder = -1;
      scene.add(skyMesh);
      panoLoaded = true;
      console.log('[avatar3d] Panorama loaded OK, src=' + panoSrc.substring(0,40));
    },
    undefined,
    function(err) {
      console.warn('[avatar3d] Panorama load failed:', err);
      /* Fallback — тёмный фон как раньше */
      scene.background = new THREE.Color(0x060e10);
    }
  );

  /* ══════════════════════════════════════════════════
     ЦЕНТРАЛЬНЫЙ СТОЛБ — реальное фото скалы Чжанцзяцзе
     Вариант A: изогнутый высокий billboard с настоящей фотографией
     + геометрический PBR-цилиндр как опора (вариант A+)
  ════════════════════════════════════════════════ */

  /* Базовый PBR материал для геометрической части */
  var matPillar = new THREE.MeshStandardMaterial({
    color: 0x6a6a58,
    roughness: 0.94,
    metalness: 0.0,
    emissive: new THREE.Color(0x030804),
    emissiveIntensity: 0.15,
  });

  /* Материал ГЛАВНОГО СТОЛБА с реальным фото скалы */
  /* Fallback цвет — серо-песчаный камень как в Чжанцзяцзе */
  var matMainPillar = new THREE.MeshStandardMaterial({
    color: 0x9a8e78,   /* серо-коричневый песчаник — виден до загрузки текстуры */
    roughness: 0.92,
    metalness: 0.0,
    emissive: new THREE.Color(0x060a04),
    emissiveIntensity: 0.12,
  });

  /* Загружаем фото скалы на главный столб */
  txLoader.load(
    (typeof PILLAR_B64 !== 'undefined' && PILLAR_B64) ? PILLAR_B64 : 'img/pillar_zhangjiajie.jpg',
    function(tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.MirroredRepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1.0, 2.5);   /* одно повторение по горизонту, 2.5 по высоте */
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      matMainPillar.map = tex;
      matMainPillar.needsUpdate = true;
      console.log('[avatar3d] Main pillar texture OK');
    },
    undefined,
    function() { console.warn('[avatar3d] Main pillar texture fail'); }
  );

  /* FBM-шум для вертексного смещения */
  function fbmNoise(angle, y, freq1, freq2, freq3) {
    var n1 = Math.sin(angle * freq1 + y * 1.4) * Math.cos(y * 0.8) * 0.16;
    var n2 = Math.sin(angle * freq2 + y * 3.1) * Math.cos(angle * 2.3) * 0.072;
    var n3 = Math.sin(angle * freq3 + y * 7.2) * 0.034;
    var groove = Math.sin(angle * 7.0 + 0.5) * 0.065
               + Math.sin(angle * 13.5 + 1.0) * 0.032
               + Math.sin(angle * 5.1 + 2.1) * 0.048
               + Math.sin(angle * 19.3 + 0.3) * 0.018;
    var bulge = Math.max(0, Math.sin(angle * 2.0 + 1.0)) * 0.08 * Math.sin(y * 0.4 + 1.0);
    return n1 + n2 + n3 + groove + bulge;
  }

  function makeRockyGeo(topR, botR, height, radSeg, hSeg) {
    var geo = new THREE.CylinderGeometry(topR, botR, height, radSeg, hSeg, false);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
      var r = Math.sqrt(px*px + pz*pz);
      if (r < 0.001) continue;
      var angle = Math.atan2(pz, px);
      var jitter = fbmNoise(angle, py, 3.5, 7.1, 15.3);
      var newR = r + jitter;
      pos.setX(i, Math.cos(angle) * newR);
      pos.setZ(i, Math.sin(angle) * newR);
    }
    geo.computeVertexNormals();
    return geo;
  }

  var radSeg = isMobile ? 48 : 80;
  var hSeg   = isMobile ? 24 : 96;

  /* Геометрическая часть столба */
  var pillarGroup = new THREE.Group();
  scene.add(pillarGroup);

  /* Основание — уходит в туман */
  var geoBase = makeRockyGeo(0.52, 0.68, 6.0, Math.floor(radSeg * 0.75), 8);
  var meshBase = new THREE.Mesh(geoBase, matPillar);
  meshBase.position.y = -6.5;
  pillarGroup.add(meshBase);

  /* ГЛАВНЫЙ СТВОЛ — реальное фото скалы (matMainPillar) */
  var geoMain = makeRockyGeo(0.24, 0.46, 20.0, radSeg, hSeg);
  var meshMain = new THREE.Mesh(geoMain, matMainPillar);
  meshMain.position.y = 3.0;
  pillarGroup.add(meshMain);

  /* Верхний пик */
  var geoCap = makeRockyGeo(0.05, 0.24, 7.0, radSeg, 24);
  var meshCap = new THREE.Mesh(geoCap, matMainPillar);
  meshCap.position.y = 16.0;
  pillarGroup.add(meshCap);

  /* Нижняя переходная часть */
  var geoLower = makeRockyGeo(0.30, 0.52, 5.0, radSeg, Math.floor(hSeg * 0.3));
  var meshLower = new THREE.Mesh(geoLower, matMainPillar);
  meshLower.position.y = -2.0;
  pillarGroup.add(meshLower);

  /* Billboard-группа не используется, но оставляем переменную для animate() */
  var billboardGroup = new THREE.Group();
  scene.add(billboardGroup);

  /* Спутники — маленькие скальные столбы по кругу */
  var satParams = [
    { x: -0.9, z: -0.6, topR: 0.10, botR: 0.18, h: 12, y: 3.0 },
    { x:  0.7, z:  0.5, topR: 0.07, botR: 0.14, h:  9, y: 4.0 },
    { x: -0.6, z:  0.8, topR: 0.12, botR: 0.20, h: 13, y: 2.5 },
  ];
  satParams.forEach(function(p) {
    var geoS = makeRockyGeo(p.topR, p.botR, p.h, Math.floor(radSeg * 0.5), Math.floor(hSeg * 0.3));
    var meshS = new THREE.Mesh(geoS, matPillar);
    meshS.position.set(p.x, p.y, p.z);
    pillarGroup.add(meshS);
  });

  /* Emissive кольцо у основания */
  var geoRing = new THREE.TorusGeometry(0.65, 0.016, 8, 80);
  var matRing = new THREE.MeshBasicMaterial({
    color: 0xaaff44,
    transparent: true,
    opacity: 0.6
  });
  var ringGlow = new THREE.Mesh(geoRing, matRing);
  ringGlow.position.y = -5.2;
  ringGlow.rotation.x = Math.PI / 2;
  pillarGroup.add(ringGlow);

  /* PBR текстуры для геометрии */
  function setupTexture(tex, isSRGB, wrapS, wrapT, repX, repY) {
    if (isSRGB) tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = wrapS;
    tex.wrapT = wrapT;
    tex.repeat.set(repX, repY);
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
    return tex;
  }

  txLoader.load('img/rock/rock_diff.jpg',
    function(tex) {
      setupTexture(tex, true, THREE.MirroredRepeatWrapping, THREE.RepeatWrapping, 1.0, 3.5);
      matPillar.map = tex;
      matPillar.color = new THREE.Color(0.68, 0.72, 0.60);
      matPillar.needsUpdate = true;
    }, undefined, function() {
      txLoader.load('img/rock/cliff_diff.jpg', function(tex) {
        setupTexture(tex, true, THREE.MirroredRepeatWrapping, THREE.RepeatWrapping, 1.0, 3.5);
        matPillar.map = tex;
        matPillar.needsUpdate = true;
      });
    }
  );

  txLoader.load('img/rock/rock_nor.jpg',
    function(tex) {
      setupTexture(tex, false, THREE.MirroredRepeatWrapping, THREE.RepeatWrapping, 1.0, 3.5);
      matPillar.normalMap = tex;
      matPillar.normalScale = new THREE.Vector2(1.8, 1.8);
      matPillar.needsUpdate = true;
    }, undefined, function() {
      txLoader.load('img/rock/cliff_nor.jpg', function(tex) {
        setupTexture(tex, false, THREE.MirroredRepeatWrapping, THREE.RepeatWrapping, 1.0, 3.5);
        matPillar.normalMap = tex;
        matPillar.normalScale = new THREE.Vector2(1.6, 1.6);
        matPillar.needsUpdate = true;
      });
    }
  );

  txLoader.load('img/rock/rock_rough.jpg',
    function(tex) {
      setupTexture(tex, false, THREE.MirroredRepeatWrapping, THREE.RepeatWrapping, 1.0, 3.5);
      matPillar.roughnessMap = tex;
      matPillar.roughness = 1.0;
      matPillar.needsUpdate = true;
    }, undefined, function() {
      txLoader.load('img/rock/cliff_rough.jpg', function(tex) {
        setupTexture(tex, false, THREE.MirroredRepeatWrapping, THREE.RepeatWrapping, 1.0, 3.5);
        matPillar.roughnessMap = tex;
        matPillar.roughness = 1.0;
        matPillar.needsUpdate = true;
      });
    }
  );

  /* ── LIGHTS — подобраны под зелёно-туманный парк ── */

  /* Hemisphere под цвет панорамы: небо серо-белёсое, земля зелёная */
  var hemiLight = new THREE.HemisphereLight(0x8a9a8a, 0x1a2a12, 0.55);
  scene.add(hemiLight);

  /* Рассеянное дневное (туманный парк — нет жёсткого солнца) */
  var ambLight = new THREE.AmbientLight(0x6a8070, 0.50);
  scene.add(ambLight);

  /* Мягкое «солнце» через туман (тёплый-нейтральный) */
  var dirLight = new THREE.DirectionalLight(0xd0d4b0, 0.90);
  dirLight.position.set(8, 18, 6);
  scene.add(dirLight);

  /* Контровой — холодный голубой, раздел с небом */
  var rimLight = new THREE.DirectionalLight(0x6a9aaa, 0.35);
  rimLight.position.set(-6, 10, -10);
  scene.add(rimLight);

  /* Подсветка снизу — зелёноватый туман земли */
  var pointBottom = new THREE.PointLight(0x55991a, 3.2, 14, 2);
  pointBottom.position.set(0, -3.0, 0);
  scene.add(pointBottom);

  var pointFog = new THREE.PointLight(0x2a5535, 1.8, 20, 2);
  pointFog.position.set(-3, -1.5, -4);
  scene.add(pointFog);

  var pillarSpot = new THREE.PointLight(0xb0c898, 2.2, 24, 2);
  pillarSpot.position.set(5, 6, 5);
  scene.add(pillarSpot);

  /* ── ТУМАН (объёмный) — слои у основания ── */
  function makeMistTexture(r, g, b, innerAlpha) {
    var sz = 512;
    var c = document.createElement('canvas');
    c.width = c.height = sz;
    var ctx = c.getContext('2d');
    var grad = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
    grad.addColorStop(0,   'rgba(' + r + ',' + g + ',' + b + ',' + innerAlpha.toFixed(2) + ')');
    grad.addColorStop(0.35,'rgba(' + r + ',' + g + ',' + b + ',' + (innerAlpha * 0.50).toFixed(2) + ')');
    grad.addColorStop(0.7, 'rgba(' + r + ',' + g + ',' + b + ',' + (innerAlpha * 0.15).toFixed(2) + ')');
    grad.addColorStop(1,   'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, sz, sz);
    var tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  /* Цвет тумана — под зелёно-серую дымку Чжанцзяцзе */
  var mistTexDense = makeMistTexture(38, 62, 44, 0.68);
  var mistTexLight = makeMistTexture(28, 50, 38, 0.42);
  var mistTexBlue  = makeMistTexture(25, 42, 52, 0.50);

  var mistLayers = [];
  var mistParams = [
    { y: -5.5, sx: 18, sz: 14, op: 0.65, spd:  0.008, tex: 'dense' },
    { y: -4.0, sx: 14, sz: 10, op: 0.50, spd: -0.006, tex: 'light' },
    { y: -2.5, sx: 10, sz:  8, op: 0.38, spd:  0.010, tex: 'blue'  },
    { y: -1.0, sx: 15, sz: 11, op: 0.26, spd: -0.007, tex: 'dense' },
    { y:  0.8, sx: 11, sz:  9, op: 0.16, spd:  0.009, tex: 'light' },
    { y: -7.0, sx: 22, sz: 18, op: 0.78, spd:  0.005, tex: 'dense' },
    { y: -3.5, sx: 16, sz: 12, op: 0.32, spd: -0.011, tex: 'blue'  },
  ];

  mistParams.forEach(function(p, i) {
    var texMap = (p.tex === 'dense') ? mistTexDense : (p.tex === 'blue') ? mistTexBlue : mistTexLight;
    var geo = new THREE.PlaneGeometry(p.sx, p.sz);
    var mat = new THREE.MeshBasicMaterial({
      map: texMap,
      transparent: true,
      opacity: p.op,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.rotation.z = (i / mistParams.length) * Math.PI * 2;
    mesh.position.y = p.y;
    mesh.position.x = (Math.random() - 0.5) * 1.5;
    mesh.position.z = (Math.random() - 0.5) * 1.5;
    mesh.userData.speed = p.spd;
    mesh.userData.baseY = p.y;
    mesh.userData.phase = i * 1.3;
    scene.add(mesh);
    mistLayers.push(mesh);
  });

  /* ── КОЛЬЦО ФОТОГРАФИЙ ── */
  var photoFiles = (typeof PHOTO_DATA !== 'undefined' && PHOTO_DATA.length > 0)
    ? PHOTO_DATA
    : [
        'img/034.jpg', 'img/035.jpg', 'img/039.jpg', 'img/040.jpg',
        'img/042.jpg', 'img/048.jpg', 'img/053.jpg', 'img/054.jpg',
        'img/055.jpg', 'img/073.jpg', 'img/082.jpg', 'img/089.jpg',
        'img/090.jpg'
      ];

  var photoGroup = new THREE.Group();
  scene.add(photoGroup);

  var loadingManager = new THREE.LoadingManager();
  var loader = new THREE.TextureLoader(loadingManager);

  var N = photoFiles.length;
  var ringRadius = isMobile ? 3.2 : 5.5;
  var photoW = isMobile ? 0.9 : 1.4;
  var photoH = photoW * 1.35;

  photoFiles.forEach(function(file, idx) {
    var angle = (idx / N) * Math.PI * 2;
    var yOffset = isMobile
      ? ((idx % 2 === 0) ? 3.2 : 1.6)
      : ((idx % 2 === 0) ? 2.2 : 0.6);
    var radiusVar = ringRadius + (idx % 3 === 0 ? 0.4 : 0);

    var group = new THREE.Group();
    group.position.set(
      Math.sin(angle) * radiusVar,
      yOffset,
      Math.cos(angle) * radiusVar
    );
    group.rotation.y = angle + Math.PI;

    var frameMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW + 0.05, photoH + 0.05),
      new THREE.MeshBasicMaterial({ color: 0x1a2a1a, side: THREE.FrontSide })
    );
    group.add(frameMesh);

    var glowMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW + 0.16, photoH + 0.16),
      new THREE.MeshBasicMaterial({
        color: 0x55ff99,
        transparent: true, opacity: 0.12,
        side: THREE.FrontSide, depthWrite: false,
      })
    );
    glowMesh.position.z = -0.01;
    group.add(glowMesh);

    var photoMat = new THREE.MeshStandardMaterial({
      roughness: 0.50, metalness: 0.0, color: 0xffffff,
    });
    var photoMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW, photoH),
      photoMat
    );
    photoMesh.position.z = 0.002;
    group.add(photoMesh);

    loader.load(
      file,
      (function(mat) {
        return function(texture) {
          texture.encoding = THREE.sRGBEncoding;
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          mat.map = texture;
          mat.needsUpdate = true;
        };
      })(photoMat),
      undefined,
      function(err) { console.warn('Photo load error:', file, err); }
    );

    photoGroup.add(group);
  });

  /* ── СВЕТЯЩАЯСЯ ПЫЛЬ ── */
  var particleCount = isMobile ? 700 : 1400;
  var pPositions = new Float32Array(particleCount * 3);
  var pSpeeds    = new Float32Array(particleCount);

  for (var i = 0; i < particleCount; i++) {
    var r = 2.0 + Math.random() * 18;
    var a = Math.random() * Math.PI * 2;
    pPositions[i*3]   = Math.cos(a) * r;
    pPositions[i*3+1] = (Math.random() - 0.3) * 22 + 2;
    pPositions[i*3+2] = Math.sin(a) * r;
    pSpeeds[i]  = 0.15 + Math.random() * 0.35;
  }

  var dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  var dustMat = new THREE.PointsMaterial({
    color: 0xd0ffcc,
    size: isMobile ? 0.10 : 0.13,
    transparent: true,
    opacity: 0.55,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  var dustPoints = new THREE.Points(dustGeo, dustMat);
  scene.add(dustPoints);

  /* ── ОРБИТАЛЬНЫЙ ОБЛЁТ ── */
  var orbitPeriod   = 38.0;
  var orbitBobAmp   = 0.9;
  var orbitBobPeriod = 13.0;

  var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', function(e) {
    mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── CURSOR ── */
  var dot  = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  var cx = 0, cy = 0, rx = 0, ry = 0;
  window.addEventListener('mousemove', function(e) { cx = e.clientX; cy = e.clientY; });

  var clock = new THREE.Clock();
  var dustPos = dustGeo.attributes.position;

  /* Панорама медленно вращается — «движение внутри парка» */
  var panoRotSpeed = 0.0008;  /* очень медленно */

  /* ── ANIMATE ── */
  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    /* Скайбокс медленно вращается (ощущение движения в парке) */
    if (skyMesh) {
      skyMesh.rotation.y = t * panoRotSpeed;
    }

    /* Billboard-столб: медленно поворачивается к зрителю (billboard behavior) */
    if (billboardGroup) {
      /* Поворачиваемся к камере по Y */
      var camAngle = Math.atan2(camera.position.x, camera.position.z);
      billboardGroup.rotation.y = camAngle + t * 0.008; /* лёгкое собственное вращение */
    }

    /* Геометрические части медленно вращаются */
    pillarGroup.rotation.y = t * 0.010;

    /* Кольцо фото */
    photoGroup.rotation.y = -t * 0.018;
    photoGroup.rotation.x = Math.sin(t * 0.28) * 0.020;

    /* Пульсация кольца и огней */
    matRing.opacity = 0.40 + Math.sin(t * 1.7) * 0.22;
    pointBottom.intensity = 2.8 + Math.sin(t * 1.1) * 0.7;
    pointFog.intensity    = 1.5 + Math.sin(t * 0.7 + 1.0) * 0.4;

    /* Туман */
    mistLayers.forEach(function(m) {
      var spd = m.userData.speed;
      var ph  = m.userData.phase;
      m.rotation.z += spd * 0.01;
      m.position.y = m.userData.baseY + Math.sin(t * 0.22 + ph) * 0.3;
      m.position.x = Math.sin(t * 0.08 + ph) * 0.8;
    });

    /* Пыль */
    for (var i = 0; i < particleCount; i++) {
      pPositions[i*3+1] += pSpeeds[i] * 0.006;
      if (pPositions[i*3+1] > 15) {
        pPositions[i*3+1] = -8 + Math.random() * 2;
      }
    }
    dustPos.needsUpdate = true;

    /* ── КАМЕРА — орбитальный облёт ── */
    var orbitAngle = (t / orbitPeriod) * Math.PI * 2;
    var bobY = orbitHeight + Math.sin(t / orbitBobPeriod * Math.PI * 2) * orbitBobAmp;
    var currentRadius = orbitRadius + Math.sin(t * 0.17) * 1.5;

    var camX = Math.cos(orbitAngle) * currentRadius;
    var camZ = Math.sin(orbitAngle) * currentRadius;

    mouse.x += (mouse.tx - mouse.x) * 0.035;
    mouse.y += (mouse.ty - mouse.y) * 0.035;
    if (!isMobile) {
      camX += mouse.x * 0.8;
      camZ += mouse.y * 0.4;
    }

    camera.position.set(camX, bobY, camZ);
    camera.lookAt(0, 2.5, 0);

    pillarSpot.position.set(camX * 0.7, bobY + 3.0, camZ * 0.7);

    /* Рендер */
    if (composer && useBloom) {
      try {
        composer.render();
      } catch(e) {
        useBloom = false;
        composer = null;
        renderer.render(scene, camera);
      }
    } else {
      renderer.render(scene, camera);
    }

    /* Cursor */
    if (dot)  { dot.style.left = cx + 'px'; dot.style.top = cy + 'px'; }
    if (ring) {
      rx += (cx - rx) * 0.11;
      ry += (cy - ry) * 0.11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
    }
  }
  animate();

})();
</script>

<!-- ═══════════════════════════════════════════════
   LOADER
══════════════════════════════════════════════ -->
<script>
(function() {
  if (document.documentElement.getAttribute('data-sl') === '1') return;

  var loaderEl  = document.getElementById('loader');
  var counterEl = document.getElementById('loader-count');
  var heroEl    = document.getElementById('hero');

  var T = 2400;
  var t0 = performance.now();
  (function tick(now) {
    var p = Math.min((now - t0) / T, 1);
    var e = p < .5 ? 2*p*p : -1 + (4 - 2*p)*p;
    counterEl.textContent = String(Math.floor(e * 100)).padStart(3, '0') + '%';
    if (p < 1) requestAnimationFrame(tick);
    else counterEl.textContent = '100%';
  })(performance.now());

  setTimeout(function() {
    if (typeof gsap !== 'undefined') {
      var W = window.innerWidth, H = window.innerHeight;
      var sv = (Math.max(W, H, 1920) / Math.min(W, H)) * 22;
      gsap.timeline()
        .to(loaderEl, { rotate: 180, scale: sv, duration: 0.85, ease: 'power3.in' })
        .to(loaderEl, { opacity: 0, duration: 0.3, ease: 'power2.out',
            onComplete: function() { loaderEl.style.display = 'none'; } }, '-=0.15')
        .to(heroEl,   { opacity: 1, duration: 0.7, ease: 'power2.out' }, '-=0.3');
    } else {
      loaderEl.style.display = 'none';
      heroEl.style.opacity = '1';
    }
  }, 2600);
})();
</script>
