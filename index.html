<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #0d1518;
  --text: #ffffde;
  --acc:  #e8fe25;
  --mint: #25fea8;
  --fd: 'Clash Display', 'Arial Black', Impact, sans-serif;
  --fb: 'Satoshi', 'Inter', system-ui, sans-serif;
}

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  cursor: none;
}

/* ── CURSOR ── */
#cur-dot {
  position: fixed; top: 0; left: 0; z-index: 9999;
  width: 8px; height: 8px;
  background: var(--acc);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
#cur-ring {
  position: fixed; top: 0; left: 0; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,222,.5);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
@media (pointer: coarse) {
  #cur-dot, #cur-ring { display: none; }
  html, body { cursor: auto; }
}

/* ── LOADING SCREEN ── */
#loader {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  transform-origin: center center;
}
#loader-count {
  font-family: var(--fd);
  font-size: clamp(5rem, 18vw, 13rem);
  font-weight: 700;
  color: var(--bg);
  letter-spacing: -0.04em;
  line-height: 1;
  user-select: none;
}

/* ── SKY GRADIENT (за canvas, просвечивает через туман) ── */
#sky-bg {
  position: fixed; inset: 0;
  z-index: 0;
  background: linear-gradient(
    to bottom,
    #020609 0%,
    #060e18 30%,
    #091810 65%,
    #0d1f0c 100%
  );
  pointer-events: none;
}

/* ── CANVAS ── */
#gl {
  position: fixed; top: 0; left: 0;
  width: 100dvw; height: 100dvh;
  z-index: 1;
  display: block;
}

/* ── HERO ── */
#hero {
  position: relative; z-index: 10;
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: clamp(1.2rem, 2.5vw, 2rem);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
}

/* Узкий градиент снизу под текстом */
#hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 45%; height: 38%;
  background: radial-gradient(ellipse at bottom left, rgba(13,21,24,.92) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* тонкая сетка */
#hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,222,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,222,.018) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none; z-index: 0;
}

.hi { position: relative; z-index: 1; display: block; }

.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.8rem;
  font-family: var(--fd);
  font-size: clamp(.55rem, 1.0vw, .80rem);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text);
  opacity: .65;
}

/* Уменьшенный заголовок — сцена = герой */
.hero-title {
  font-family: var(--fd);
  font-size: clamp(1.8rem, 5vw, 4.8rem);
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: .88;
  text-transform: uppercase;
  color: var(--text);
  transform: scaleY(2);
  transform-origin: bottom center;
  display: block;
  margin-bottom: 1.6rem;
  pointer-events: auto;
}

.hero-cta {
  pointer-events: auto;
  display: inline-block;
  font-family: var(--fd);
  font-size: clamp(.6rem, 1.0vw, .85rem);
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--acc);
  padding: .65em 1.3em;
  text-decoration: none;
  cursor: none;
  transition: background .2s;
  margin-bottom: 2rem;
}
.hero-cta:hover { background: var(--text); }

/* ── MOBILE ── */
@media (max-width: 767px) {
  #hero {
    padding: 1rem 1rem;
    overflow: visible;
    justify-content: flex-end;
  }
  .hi {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .hero-title {
    font-size: clamp(1.6rem, 10vw, 3.2rem);
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
    transform-origin: bottom left;
    overflow: visible;
  }
  .hero-meta {
    font-size: clamp(.45rem, 2.8vw, .65rem);
    letter-spacing: .08em;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    margin-bottom: 0.6rem;
    opacity: .6;
    justify-content: flex-start;
  }
  .hero-meta span { display: block; }
  .hero-cta { margin-bottom: 1.2rem; }
  #hero::after {
    width: 80%; height: 35%;
  }
}

<!-- Three.js r128 UMD (global THREE) -->
<script src="./three.min.js"></script>
<!-- GSAP UMD -->
<script src="./gsap.min.js"></script>

<!-- Postprocessing (Three.js r128 examples, локальные UMD-копии) -->
<script src="./CopyShader.js"></script>
<script src="./LuminosityHighPassShader.js"></script>
<script src="./EffectComposer.js"></script>
<script src="./RenderPass.js"></script>
<script src="./ShaderPass.js"></script>
<script src="./UnrealBloomPass.js"></script>

<script>
/* ═══════════════════════════════════════════════
   THREE.JS SCENE — «каменный столб в туманном каньоне»
═══════════════════════════════════════════════ */
(function() {
  var isMobile = window.innerWidth < 768;
  var dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 1.5);
  var canvas = document.getElementById('gl');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: !isMobile,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = false;
  } catch(e) {
    console.warn('WebGL failed:', e);
    canvas.style.display = 'none';
    renderer = null;
  }
  if (!renderer) return;

  var scene = new THREE.Scene();
  /* Тёмно-сине-зелёный туман — плотнее для атмосферы каньона */
  scene.fog = new THREE.FogExp2(0x060e10, 0.040);

  /* ── CAMERA ── */
  var fov = isMobile ? 55 : 42;
  var camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 200);

  var orbitRadius = isMobile ? 7.5 : 11.5;
  var orbitHeight = isMobile ? 0.5 : -0.5;
  camera.position.set(orbitRadius, orbitHeight, 0);
  camera.lookAt(0, 2.0, 0);

  /* ── POSTPROCESSING ── */
  var composer = null;
  var useBloom = false;
  try {
    if (typeof THREE.EffectComposer !== 'undefined' &&
        typeof THREE.RenderPass !== 'undefined' &&
        typeof THREE.UnrealBloomPass !== 'undefined') {

      var renderTarget = new THREE.WebGLRenderTarget(
        window.innerWidth * dpr,
        window.innerHeight * dpr,
        {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
          encoding: THREE.sRGBEncoding
        }
      );

      composer = new THREE.EffectComposer(renderer, renderTarget);
      var renderPass = new THREE.RenderPass(scene, camera);
      composer.addPass(renderPass);

      var bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.75,  /* strength */
        0.45,  /* radius */
        0.78   /* threshold */
      );
      composer.addPass(bloomPass);
      useBloom = true;
      console.log('[avatar3d] EffectComposer + UnrealBloomPass OK');
    } else {
      console.log('[avatar3d] Bloom scripts not loaded, using direct render');
    }
  } catch(bloomErr) {
    console.warn('[avatar3d] Bloom init error, fallback:', bloomErr);
    composer = null;
    useBloom = false;
  }

  /* ── LIGHTS ── */
  var ambient = new THREE.AmbientLight(0x1a2820, 0.55);
  scene.add(ambient);

  var dirLight = new THREE.DirectionalLight(0xb0c8a0, 1.1);
  dirLight.position.set(5, 12, 4);
  scene.add(dirLight);

  /* Подсветка снизу — тёплый акцент, bloom-совместимый */
  var pointBottom = new THREE.PointLight(0xaaee44, 5.0, 12, 2);
  pointBottom.position.set(0, -3.0, 0);
  scene.add(pointBottom);

  var pointFog = new THREE.PointLight(0x55cc77, 3.0, 22, 2);
  pointFog.position.set(-3, -1.5, -4);
  scene.add(pointFog);

  var rimLight = new THREE.DirectionalLight(0xaaffcc, 0.75);
  rimLight.position.set(-3, 4, -7);
  scene.add(rimLight);

  var pillarSpot = new THREE.PointLight(0xd8edc8, 3.0, 22, 2);
  pillarSpot.position.set(5, 4, 5);
  scene.add(pillarSpot);

  /* ── ТЕКСТУРА СТОЛБА — img/082.jpg (1280x1893 вертикальная скала) ── */
  var txLoader = new THREE.TextureLoader();

  /* MeshStandardMaterial — получает все lights сцены */
  /* Цвет без текстуры — тёмная каменная поверхность с зеленоватым отливом */
  var matPillar = new THREE.MeshStandardMaterial({
    color: 0x3a4438,
    roughness: 0.92,
    metalness: 0.02,
    emissive: new THREE.Color(0x0a2010),
    emissiveIntensity: 0.4,
    envMapIntensity: 0.08,
  });

  /* emissive rim снизу — будет подхвачен bloom */
  var matPillarEmissive = new THREE.Color(0x1a3a08);

  function applyPillarTexture(texture) {
    texture.encoding = THREE.sRGBEncoding;
    /* MirroredRepeatWrapping убирает шов — зеркалит по горизонтали */
    texture.wrapS = THREE.MirroredRepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    /* repeat.x = 1 с mirrored = один оборот без шва */
    texture.repeat.set(1.0, 2.8);
    texture.minFilter = THREE.LinearMipmapLinearFilter;
    texture.magFilter = THREE.LinearFilter;
    matPillar.map = texture;
    matPillar.color = new THREE.Color(0xffffff);
    matPillar.emissive = matPillarEmissive;
    matPillar.emissiveIntensity = 0.18;
    matPillar.needsUpdate = true;
  }

  txLoader.load(
    'img/082.jpg',
    function(tex) { applyPillarTexture(tex); },
    undefined,
    function() {
      txLoader.load('img/055.jpg',
        function(tex) { applyPillarTexture(tex); },
        undefined,
        function() {
          txLoader.load('img/048.jpg',
            function(tex) { applyPillarTexture(tex); }
          );
        }
      );
    }
  );

  /* ── ВСПОМОГАТЕЛЬНЫЙ ШУМ ДЛЯ ДЕФОРМАЦИИ ВЕРШИН ── */
  function fbmNoise(angle, y, freq1, freq2, freq3) {
    var n1 = Math.sin(angle * freq1 + y * 1.7) * Math.cos(y * 0.9) * 0.10;
    var n2 = Math.sin(angle * freq2 + y * 3.3) * 0.048;
    var n3 = Math.sin(angle * freq3 + y * 6.8) * 0.024;
    /* Вертикальные борозды скалы */
    var groove = Math.sin(angle * 9.0) * 0.042
               + Math.sin(angle * 17.5) * 0.020
               + Math.sin(angle * 5.3 + 1.1) * 0.028;
    return n1 + n2 + n3 + groove;
  }

  /* ── КАМЕННАЯ ГЕОМЕТРИЯ — CylinderGeometry высокого качества ── */
  function makeRockyGeo(topR, botR, height, radSeg, hSeg) {
    /* radSeg >= 64 для плавного цилиндра без граней */
    var geo = new THREE.CylinderGeometry(topR, botR, height, radSeg, hSeg, false);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
      var r = Math.sqrt(px*px + pz*pz);
      if (r < 0.001) continue;
      var angle = Math.atan2(pz, px);
      var jitter = fbmNoise(angle, py, 3.7, 7.3, 14.1);
      var newR = r + jitter;
      pos.setX(i, Math.cos(angle) * newR);
      pos.setZ(i, Math.sin(angle) * newR);
    }
    geo.computeVertexNormals();
    return geo;
  }

  /* ── ЦЕНТРАЛЬНЫЙ СТОЛБ — группа секций ── */
  var pillarGroup = new THREE.Group();
  scene.add(pillarGroup);

  var radSeg = isMobile ? 32 : 64;
  var hSeg   = isMobile ? 16 : 32;

  /* Основной монолит — высокий, уходит за кадр вверх */
  var geoMain = makeRockyGeo(0.22, 0.40, 16.0, radSeg, hSeg);
  var meshMain = new THREE.Mesh(geoMain, matPillar);
  meshMain.position.y = 2.5;
  pillarGroup.add(meshMain);

  /* Верхний пик — острый, за кадром */
  var geoCap = makeRockyGeo(0.04, 0.22, 6.0, radSeg, 8);
  var meshCap = new THREE.Mesh(geoCap, matPillar);
  meshCap.position.y = 13.0;
  pillarGroup.add(meshCap);

  /* Нижний выступ — уходит в туман */
  var geoBase = makeRockyGeo(0.50, 0.62, 5.5, radSeg, 6);
  var meshBase = new THREE.Mesh(geoBase, matPillar);
  meshBase.position.y = -6.5;
  pillarGroup.add(meshBase);

  /* Emissive кольцо у основания — bloom-цель */
  var geoRing = new THREE.TorusGeometry(0.60, 0.018, 8, 80);
  var matRing = new THREE.MeshBasicMaterial({
    color: 0xaaff44,
    transparent: true,
    opacity: 0.7
  });
  var ringGlow = new THREE.Mesh(geoRing, matRing);
  ringGlow.position.y = -4.8;
  ringGlow.rotation.x = Math.PI / 2;
  pillarGroup.add(ringGlow);

  /* ── ОБЪЁМНЫЙ ТУМАН — аддитивные спрайты/плоскости ── */
  /* Создаём radial-gradient текстуру в canvas — светящийся туман */
  function makeMistTexture(r, g, b, innerAlpha) {
    var sz = 512;
    var c = document.createElement('canvas');
    c.width = c.height = sz;
    var ctx = c.getContext('2d');
    var grad = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
    grad.addColorStop(0,   'rgba(' + r + ',' + g + ',' + b + ',' + innerAlpha.toFixed(2) + ')');
    grad.addColorStop(0.35,'rgba(' + r + ',' + g + ',' + b + ',' + (innerAlpha * 0.55).toFixed(2) + ')');
    grad.addColorStop(0.7, 'rgba(' + r + ',' + g + ',' + b + ',' + (innerAlpha * 0.18).toFixed(2) + ')');
    grad.addColorStop(1,   'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, sz, sz);
    var tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  /* Тёмно-зелёный туман с лёгким свечением */
  var mistTexDense = makeMistTexture(18, 55, 35, 0.75);
  var mistTexLight = makeMistTexture(14, 42, 28, 0.45);
  var mistTexBlue  = makeMistTexture(10, 30, 40, 0.55);

  /* Слои тумана у основания столба — AdditiveBlending = виден на тёмном */
  var mistLayers = [];
  var mistParams = [
    { y: -5.5, sx: 16, sz: 12, op: 0.70, spd:  0.008, tex: 'dense' },
    { y: -4.0, sx: 12, sz:  9, op: 0.55, spd: -0.006, tex: 'light' },
    { y: -2.5, sx:  9, sz:  7, op: 0.40, spd:  0.010, tex: 'blue'  },
    { y: -1.0, sx: 13, sz: 10, op: 0.28, spd: -0.007, tex: 'dense' },
    { y:  0.8, sx: 10, sz:  8, op: 0.18, spd:  0.009, tex: 'light' },
    { y: -7.0, sx: 20, sz: 16, op: 0.80, spd:  0.005, tex: 'dense' },
    { y: -3.5, sx: 14, sz: 11, op: 0.35, spd: -0.011, tex: 'blue'  },
  ];

  mistParams.forEach(function(p, i) {
    var texMap = (p.tex === 'dense') ? mistTexDense : (p.tex === 'blue') ? mistTexBlue : mistTexLight;
    var geo = new THREE.PlaneGeometry(p.sx, p.sz);
    var mat = new THREE.MeshBasicMaterial({
      map: texMap,
      transparent: true,
      opacity: p.op,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    /* Небольшой наклон для разнообразия */
    mesh.rotation.z = (i / mistParams.length) * Math.PI * 2;
    mesh.position.y = p.y;
    mesh.position.x = (Math.random() - 0.5) * 1.5;
    mesh.position.z = (Math.random() - 0.5) * 1.5;
    mesh.userData.speed = p.spd;
    mesh.userData.baseY = p.y;
    mesh.userData.phase = i * 1.3;
    scene.add(mesh);
    mistLayers.push(mesh);
  });

  /* Дополнительный слой тумана на средней дистанции */
  var midMistParams = [
    { angle: 0.8,  dist: 8,  y: -3.5, sx: 16, sz: 10, op: 0.35 },
    { angle: 2.5,  dist: 10, y: -4.0, sx: 20, sz: 12, op: 0.28 },
    { angle: 4.2,  dist: 7,  y: -2.5, sx: 14, sz: 8,  op: 0.32 },
  ];

  midMistParams.forEach(function(p) {
    var geo = new THREE.PlaneGeometry(p.sx, p.sz);
    var mat = new THREE.MeshBasicMaterial({
      map: mistTexLight,
      transparent: true,
      opacity: p.op,
      depthWrite: false,
      blending: THREE.NormalBlending,
      side: THREE.DoubleSide,
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(
      Math.cos(p.angle) * p.dist,
      p.y,
      Math.sin(p.angle) * p.dist
    );
    scene.add(mesh);
    midMistParams._mesh = mesh;
  });

  /* ── ФОНОВЫЕ ПИКИ — силуэты тонут в тумане ── */
  var peakTxList = [];
  ['img/034.jpg', 'img/048.jpg', 'img/055.jpg'].forEach(function(src) {
    txLoader.load(src, function(tex) {
      tex.encoding = THREE.sRGBEncoding;
      peakTxList.push(tex);
    });
  });

  var peakParams = [
    [0.4,  22, 0.0, 1.2],
    [1.1,  27, -1.0, 0.9],
    [2.0,  18, 0.5, 1.4],
    [3.0,  24, -0.5, 1.0],
    [3.9,  20, 0.0, 1.1],
    [4.8,  29, -1.0, 0.85],
    [5.6,  21, 0.5, 1.3],
  ];

  peakParams.forEach(function(p, idx) {
    var angle = p[0], dist = p[1], baseY = p[2], scale = p[3];
    var peakH = (8.0 + Math.random() * 6.0) * scale;
    var peakR = (0.8 + Math.random() * 0.6) * scale;
    var geo = makeRockyGeo(0.05, peakR, peakH, isMobile ? 16 : 32, 4);
    var col = new THREE.Color(
      0.03 + Math.random() * 0.025,
      0.05 + Math.random() * 0.03,
      0.03 + Math.random() * 0.025
    );
    var mat = new THREE.MeshStandardMaterial({
      color: col, roughness: 0.98, metalness: 0.0
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      Math.cos(angle) * dist,
      baseY + peakH * 0.5 - 5.0,
      Math.sin(angle) * dist
    );
    scene.add(mesh);
  });

  /* ── КОЛЬЦО ФОТОГРАФИЙ ── */
  var photoFiles = (typeof PHOTO_DATA !== 'undefined' && PHOTO_DATA.length > 0)
    ? PHOTO_DATA
    : [
        'img/034.jpg', 'img/035.jpg', 'img/039.jpg', 'img/040.jpg',
        'img/042.jpg', 'img/048.jpg', 'img/053.jpg', 'img/054.jpg',
        'img/055.jpg', 'img/073.jpg', 'img/082.jpg', 'img/089.jpg',
        'img/090.jpg'
      ];

  var photoGroup = new THREE.Group();
  scene.add(photoGroup);

  var loadingManager = new THREE.LoadingManager();
  var loader = new THREE.TextureLoader(loadingManager);

  var N = photoFiles.length;
  var ringRadius = isMobile ? 3.2 : 5.5;
  var photoW = isMobile ? 0.9 : 1.4;
  var photoH = photoW * 1.35;

  photoFiles.forEach(function(file, idx) {
    var angle = (idx / N) * Math.PI * 2;
    var yOffset = isMobile
      ? ((idx % 2 === 0) ? 3.2 : 1.6)
      : ((idx % 2 === 0) ? 2.2 : 0.6);
    var radiusVar = ringRadius + (idx % 3 === 0 ? 0.4 : 0);

    var group = new THREE.Group();
    group.position.set(
      Math.sin(angle) * radiusVar,
      yOffset,
      Math.cos(angle) * radiusVar
    );
    group.rotation.y = angle + Math.PI;

    /* Рамка */
    var frameMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW + 0.05, photoH + 0.05),
      new THREE.MeshBasicMaterial({ color: 0x1a2a1a, side: THREE.FrontSide })
    );
    group.add(frameMesh);

    /* Свечение рамки — bloom-цель */
    var glowMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW + 0.16, photoH + 0.16),
      new THREE.MeshBasicMaterial({
        color: 0x55ff99,
        transparent: true, opacity: 0.14,
        side: THREE.FrontSide, depthWrite: false,
      })
    );
    glowMesh.position.z = -0.01;
    group.add(glowMesh);

    /* Фото */
    var photoMat = new THREE.MeshStandardMaterial({
      roughness: 0.50, metalness: 0.0, color: 0xffffff,
    });
    var photoMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(photoW, photoH),
      photoMat
    );
    photoMesh.position.z = 0.002;
    group.add(photoMesh);

    loader.load(
      file,
      (function(mat) {
        return function(texture) {
          texture.encoding = THREE.sRGBEncoding;
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          mat.map = texture;
          mat.needsUpdate = true;
        };
      })(photoMat),
      undefined,
      function(err) { console.warn('Photo load error:', file, err); }
    );

    photoGroup.add(group);
  });

  /* ── СВЕТЯЩАЯСЯ ПЫЛЬ (Points) — крупнее и заметнее ── */
  var particleCount = isMobile ? 700 : 1400;
  var pPositions = new Float32Array(particleCount * 3);
  var pSpeeds    = new Float32Array(particleCount);
  var pPhases    = new Float32Array(particleCount);

  for (var i = 0; i < particleCount; i++) {
    /* Концентрируем вблизи столба, не на горизонте */
    var r = 2.0 + Math.random() * 18;
    var a = Math.random() * Math.PI * 2;
    pPositions[i*3]   = Math.cos(a) * r;
    pPositions[i*3+1] = (Math.random() - 0.3) * 22 + 2;
    pPositions[i*3+2] = Math.sin(a) * r;
    pSpeeds[i]  = 0.15 + Math.random() * 0.35;
    pPhases[i]  = Math.random() * Math.PI * 2;
  }

  var dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  var dustMat = new THREE.PointsMaterial({
    color: 0xccffdd,
    size: isMobile ? 0.12 : 0.15,
    transparent: true,
    opacity: 0.70,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  var dustPoints = new THREE.Points(dustGeo, dustMat);
  scene.add(dustPoints);

  /* ── ОРБИТАЛЬНЫЙ ОБЛЁТ ── */
  var orbitPeriod   = 35.0;
  var orbitBobAmp   = 0.9;
  var orbitBobPeriod = 12.0;

  var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', function(e) {
    mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── CURSOR ── */
  var dot  = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  var cx = 0, cy = 0, rx = 0, ry = 0;
  window.addEventListener('mousemove', function(e) { cx = e.clientX; cy = e.clientY; });

  var clock = new THREE.Clock();
  var dustPos = dustGeo.attributes.position;

  /* ── ANIMATE ── */
  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    /* Столб медленно вращается */
    pillarGroup.rotation.y = t * 0.014;

    /* Кольцо фото — в другую сторону */
    photoGroup.rotation.y = -t * 0.018;
    photoGroup.rotation.x = Math.sin(t * 0.28) * 0.022;

    /* Пульсация кольца */
    matRing.opacity = 0.45 + Math.sin(t * 1.7) * 0.25;
    pointBottom.intensity = 3.0 + Math.sin(t * 1.1) * 0.8;
    pointFog.intensity    = 1.7 + Math.sin(t * 0.7 + 1.0) * 0.5;

    /* ── ДЫМКА — дрейф слоёв ── */
    mistLayers.forEach(function(m) {
      var spd = m.userData.speed;
      var ph  = m.userData.phase;
      m.rotation.z += spd * 0.01;
      m.position.y = m.userData.baseY + Math.sin(t * 0.22 + ph) * 0.3;
      m.position.x = Math.sin(t * 0.08 + ph) * 0.8;
    });

    /* ── ПЫЛЬ — дрейф вверх ── */
    for (var i = 0; i < particleCount; i++) {
      pPositions[i*3+1] += pSpeeds[i] * 0.006;
      /* Переносим вниз когда уходит слишком высоко */
      if (pPositions[i*3+1] > 15) {
        pPositions[i*3+1] = -8 + Math.random() * 2;
      }
    }
    dustPos.needsUpdate = true;

    /* ── КАМЕРА — орбитальный облёт ── */
    var orbitAngle = (t / orbitPeriod) * Math.PI * 2;
    var bobY = orbitHeight + Math.sin(t / orbitBobPeriod * Math.PI * 2) * orbitBobAmp;
    var currentRadius = orbitRadius + Math.sin(t * 0.17) * 1.5;

    var camX = Math.cos(orbitAngle) * currentRadius;
    var camZ = Math.sin(orbitAngle) * currentRadius;

    mouse.x += (mouse.tx - mouse.x) * 0.035;
    mouse.y += (mouse.ty - mouse.y) * 0.035;
    if (!isMobile) {
      camX += mouse.x * 0.8;
      camZ += mouse.y * 0.4;
    }

    camera.position.set(camX, bobY, camZ);
    camera.lookAt(0, 2.5, 0);

    pillarSpot.position.set(camX * 0.7, bobY + 2.5, camZ * 0.7);

    /* Рендер — через composer (bloom) или напрямую */
    if (composer && useBloom) {
      try {
        composer.render();
      } catch(e) {
        /* Если boom упал во время рендера — переключаемся на прямой */
        useBloom = false;
        composer = null;
        renderer.render(scene, camera);
      }
    } else {
      renderer.render(scene, camera);
    }

    /* Cursor */
    if (dot)  { dot.style.left = cx + 'px'; dot.style.top = cy + 'px'; }
    if (ring) {
      rx += (cx - rx) * 0.11;
      ry += (cy - ry) * 0.11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
    }
  }
  animate();

})();
</script>

<!-- ═══════════════════════════════════════════════
   LOADER
══════════════════════════════════════════════ -->
<script>
(function() {
  if (document.documentElement.getAttribute('data-sl') === '1') return;

  var loaderEl  = document.getElementById('loader');
  var counterEl = document.getElementById('loader-count');
  var heroEl    = document.getElementById('hero');

  var T = 2400;
  var t0 = performance.now();
  (function tick(now) {
    var p = Math.min((now - t0) / T, 1);
    var e = p < .5 ? 2*p*p : -1 + (4 - 2*p)*p;
    counterEl.textContent = String(Math.floor(e * 100)).padStart(3, '0') + '%';
    if (p < 1) requestAnimationFrame(tick);
    else counterEl.textContent = '100%';
  })(performance.now());

  setTimeout(function() {
    if (typeof gsap !== 'undefined') {
      var W = window.innerWidth, H = window.innerHeight;
      var sv = (Math.max(W, H, 1920) / Math.min(W, H)) * 22;
      gsap.timeline()
        .to(loaderEl, { rotate: 180, scale: sv, duration: 0.85, ease: 'power3.in' })
        .to(loaderEl, { opacity: 0, duration: 0.3, ease: 'power2.out',
            onComplete: function() { loaderEl.style.display = 'none'; } }, '-=0.15')
        .to(heroEl,   { opacity: 1, duration: 0.7, ease: 'power2.out' }, '-=0.3');
    } else {
      loaderEl.style.display = 'none';
      heroEl.style.opacity = '1';
    }
  }, 2600);
})();
</script>
