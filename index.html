<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:    #1d1d1d;
  --text:  #ffffde;
  --acc:   #e8fe25;
  --mint:  #25fea8;
  --fd: 'Clash Display', 'Arial Black', Impact, sans-serif;
  --fb: 'Satoshi', 'Inter', system-ui, sans-serif;
}

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  cursor: none;
}

/* ── CURSOR ── */
#cur-dot {
  position: fixed; top: 0; left: 0; z-index: 9999;
  width: 8px; height: 8px;
  background: var(--acc);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
#cur-ring {
  position: fixed; top: 0; left: 0; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,222,.5);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
}
@media (pointer: coarse) {
  #cur-dot, #cur-ring { display: none; }
  html, body { cursor: auto; }
}

/* ── LOADING SCREEN ── */
#loader {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  transform-origin: center center;
}
#loader-count {
  font-family: var(--fd);
  font-size: clamp(5rem, 18vw, 13rem);
  font-weight: 700;
  color: var(--bg);
  letter-spacing: -0.04em;
  line-height: 1;
  user-select: none;
}

/* ── CANVAS ── */
#gl {
  position: fixed; top: 0; left: 0;
  width: 100dvw; height: 100dvh;
  z-index: 1;
  display: block;
}

/* ── HERO ── */
#hero {
  position: relative; z-index: 10;
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: clamp(1.5rem, 3vw, 2.5rem);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
}
/* grid подложка */
#hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,222,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,222,.035) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none; z-index: 0;
}
.hi { position: relative; z-index: 1; display: block; }

.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.8rem;
  font-family: var(--fd);
  font-size: clamp(.55rem, 1.1vw, .82rem);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text);
  opacity: .62;
}

.hero-title {
  font-family: var(--fd);
  font-size: clamp(3.5rem, 13.4vw, 13.5rem);
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: .85;
  text-transform: uppercase;
  color: var(--text);
  transform: scaleY(2);
  transform-origin: bottom center;
  display: block;
  margin-bottom: 4rem;
  pointer-events: auto;
}

.hero-cta {
  pointer-events: auto;
  display: inline-block;
  font-family: var(--fd);
  font-size: clamp(.6rem, 1.1vw, .85rem);
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--acc);
  padding: .65em 1.3em;
  text-decoration: none;
  cursor: none;
  transition: background .2s;
  margin-bottom: 2.5rem;
}
.hero-cta:hover { background: var(--text); }

/* ── MOBILE ── */
@media (max-width: 767px) {
  #hero {
    padding: 1rem 1rem;
    overflow: visible;
    justify-content: flex-end;
  }

  /* .hi — flex-контейнер только на мобилке,
     переставляем порядок: заголовок → мета → кнопка */
  .hi {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .hero-title {
    font-size: clamp(2.2rem, 15.5vw, 4.8rem);
    letter-spacing: -0.02em;
    margin-bottom: 0.8rem;
    transform-origin: bottom left;
    overflow: visible;
  }

  /* мета — после заголовка в DOM, стилизуем компактно */
  .hero-meta {
    font-size: clamp(.4rem, 2.5vw, .6rem);
    letter-spacing: .08em;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    margin-bottom: 0.8rem;
    opacity: .5;
    justify-content: flex-start;
  }
  .hero-meta span {
    display: block;
  }

  .hero-cta {
    margin-bottom: 1.5rem;
  }
}
</style>

<!-- Three.js r128 UMD (global THREE) — локальный файл -->
<script src="./three.min.js"></script>
<!-- GSAP — локальный -->
<script src="./gsap.min.js"></script>

<script>
/* ═══════════════════════════════════════════════
   VERTEX SHADER — Low-frequency simplex3 деформация
   freq=0.8, amp=0.15, speed=0.18
   НЕТ высокочастотного шума
═══════════════════════════════════════════════ */
var VS = [
'precision highp float;',
'uniform float uTime;',
'varying vec3 vNormal;',
'varying vec3 vPos;',

/* Simplex 3D noise — Ashima Arts */
'vec3 m3(vec3 x){return x-floor(x*(1./289.))*289.;}',
'vec4 m4(vec4 x){return x-floor(x*(1./289.))*289.;}',
'vec4 pm(vec4 x){return m4(((x*34.)+1.)*x);}',
'vec4 ts(vec4 r){return 1.79284291400159-0.85373472095314*r;}',
'float sn3(vec3 v){',
'  const vec2 C=vec2(1./6.,1./3.);',
'  const vec4 D=vec4(0.,.5,1.,2.);',
'  vec3 i=floor(v+dot(v,C.yyy));',
'  vec3 x0=v-i+dot(i,C.xxx);',
'  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;',
'  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);',
'  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;',
'  i=m3(i);',
'  vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));',
'  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;',
'  vec4 j=p-49.*floor(p*ns.z*ns.z);',
'  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);',
'  vec4 xs=x_*ns.x+ns.yyyy;vec4 ys=y_*ns.x+ns.yyyy;',
'  vec4 h=1.-abs(xs)-abs(ys);',
'  vec4 b0=vec4(xs.xy,ys.xy);vec4 b1=vec4(xs.zw,ys.zw);',
'  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;',
'  vec4 sh=-step(h,vec4(0.));',
'  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
'  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);',
'  vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);',
'  vec4 nm=ts(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
'  p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;',
'  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);',
'  m=m*m;',
'  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
'}',

'void main(){',
'  vNormal=normal;',
'  /* LOW-FREQ деформация: freq=0.8, amp=0.15 */',
'  float n=sn3(position*0.8+uTime*0.18);',
'  vec3 pos=position+normal*n*0.15;',
'  /* мягкое Y-дыхание */',
'  pos+=normal*sin(uTime*0.35+position.y*1.2)*0.04;',
'  vPos=pos;',
'  gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);',
'}'
].join('\n');

/* ═══════════════════════════════════════════════
   FRAGMENT SHADER
   - gradient mint→deep-sea по нормали (надёжнее на статичном скрине)
   - fresnel rim
   - diffuse + specular
═══════════════════════════════════════════════ */
var FS = [
'precision highp float;',
'uniform float uTime;',
'uniform vec3 uColorA;',
'uniform vec3 uColorB;',
'uniform vec3 uRimColor;',
'varying vec3 vNormal;',
'varying vec3 vPos;',

'void main(){',
'  vec3 n=normalize(vNormal);',
'  vec3 viewDir=normalize(cameraPosition-vPos);',
'  vec3 light=normalize(vec3(1.5,1.2,2.0));',

  /* gradient по нормали — надёжно виден даже без движения */
'  float t=n.y*0.5+0.5;',
'  vec3 col=mix(uColorB,uColorA,t);',

  /* diffuse */
'  float diff=max(dot(n,light),0.0);',
'  col+=diff*uColorA*0.22;',

  /* fresnel rim */
'  float fr=pow(1.0-max(dot(viewDir,n),0.0),2.5);',
'  col+=fr*uRimColor*0.40;',

  /* specular */
'  vec3 hv=normalize(light+viewDir);',
'  float sp=pow(max(dot(n,hv),0.0),48.0);',
'  col+=sp*vec3(1.0)*0.35;',

'  gl_FragColor=vec4(clamp(col,0.,1.),1.0);',
'}'
].join('\n');

/* ═══════════════════════════════════════════════
   THREE.JS SCENE
═══════════════════════════════════════════════ */
(function() {
  var isMobile = window.innerWidth < 768;
  var dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 1.5);
  var canvas = document.getElementById('gl');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
  } catch(e) {
    console.warn('WebGL failed:', e);
    canvas.style.display = 'none';
    renderer = null;
  }

  if (!renderer) return;

  var camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 8);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1d1d1d);

  /* Ambient + Directional света для глубины */
  var ambient = new THREE.AmbientLight(0x404050, 0.6);
  scene.add(ambient);
  var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(2, 3, 5);
  scene.add(dirLight);

  /* Шар */
  var seg = isMobile ? 64 : 128;
  var geo = new THREE.SphereGeometry(1.65, seg, seg);

  var uniforms = {
    uTime:     { value: 0 },
    uColorA:   { value: new THREE.Color(0x69D2B7) }, /* мятный */
    uColorB:   { value: new THREE.Color(0x0d2030) }, /* тёмно-морской */
    uRimColor: { value: new THREE.Color(0xffffde) }, /* кремовый */
  };

  var mat = new THREE.ShaderMaterial({
    vertexShader:   VS,
    fragmentShader: FS,
    uniforms:       uniforms,
  });

  var sphere = new THREE.Mesh(geo, mat);
  /* на десктопе — вправо и ВЫШЕ (чтобы не перекрывать «MAP»);
     на мобиле — по центру, выше середины экрана, меньше */
  if (isMobile) {
    /* мобилка: уменьшаем масштаб до ~0.44 (~35% высоты),
       X=0 — по центру, Y=1.4 — верхняя треть экрана */
    sphere.scale.setScalar(0.44);
    sphere.position.set(0.0, 1.4, 0);
  } else {
    /* десктоп: поднимаем Y с 0.4 → 1.0 и сдвигаем правее X с 2.8 → 3.1 */
    sphere.position.set(3.1, 1.0, -0.5);
  }
  scene.add(sphere);

  var clock = new THREE.Clock();

  /* Mouse parallax */
  var mouse = { x:0, y:0, tx:0, ty:0 };
  window.addEventListener('mousemove', function(e) {
    mouse.tx = (e.clientX/window.innerWidth - 0.5)*2;
    mouse.ty = -(e.clientY/window.innerHeight - 0.5)*2;
  });

  /* Resize */
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* Cursor */
  var dot  = document.getElementById('cur-dot');
  var ring = document.getElementById('cur-ring');
  var cx=0, cy=0, rx=0, ry=0;
  window.addEventListener('mousemove', function(e){ cx=e.clientX; cy=e.clientY; });

  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();
    uniforms.uTime.value = t;
    sphere.rotation.y += 0.003;
    sphere.rotation.x += 0.001;
    mouse.x += (mouse.tx - mouse.x)*0.04;
    mouse.y += (mouse.ty - mouse.y)*0.04;
    if (isMobile) {
      /* на мобилке parallax не нужен (нет мыши), базовая позиция */
      sphere.position.x = 0.0;
      sphere.position.y = 1.4;
    } else {
      sphere.position.x = 3.1 + mouse.x * 0.3;
      sphere.position.y = 1.0 + mouse.y * 0.2;
    }
    renderer.render(scene, camera);
    if (dot)  { dot.style.left  = cx+'px'; dot.style.top  = cy+'px'; }
    if (ring) {
      rx+=(cx-rx)*0.11; ry+=(cy-ry)*0.11;
      ring.style.left = rx+'px'; ring.style.top = ry+'px';
    }
  }
  animate();
})();

/* ═══════════════════════════════════════════════
   LOADER (только если НЕ skiploader)
═══════════════════════════════════════════════ */
(function() {
  if (document.documentElement.getAttribute('data-sl') === '1') return;

  var loaderEl  = document.getElementById('loader');
  var counterEl = document.getElementById('loader-count');
  var heroEl    = document.getElementById('hero');

  /* счётчик 000→100% за 2.4s */
  var T = 2400;
  var t0 = performance.now();
  (function tick(now) {
    var p = Math.min((now - t0)/T, 1);
    var e = p<.5 ? 2*p*p : -1+(4-2*p)*p;
    counterEl.textContent = String(Math.floor(e*100)).padStart(3,'0')+'%';
    if (p<1) requestAnimationFrame(tick);
    else counterEl.textContent='100%';
  })(performance.now());

  /* ГАРАНТИРОВАННЫЙ уход через 2.6s */
  setTimeout(function() {
    if (typeof gsap !== 'undefined') {
      var W=window.innerWidth, H=window.innerHeight;
      var sv=(Math.max(W,H,1920)/Math.min(W,H))*22;
      gsap.timeline()
        .to(loaderEl, { rotate:180, scale:sv, duration:0.85, ease:'power3.in' })
        .to(loaderEl, { opacity:0, duration:0.3, ease:'power2.out',
            onComplete: function(){ loaderEl.style.display='none'; } }, '-=0.15')
        .to(heroEl,   { opacity:1, duration:0.7, ease:'power2.out' }, '-=0.3');
    } else {
      loaderEl.style.display='none';
      heroEl.style.opacity='1';
    }
  }, 2600);
})();
</script>
</body>
